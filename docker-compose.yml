services:
  dorks-and-dice-hex-crawl:
    image: dorks-and-dice-hex-crawl:latest
    container_name: dorks-and-dice-hex-crawl
    restart: unless-stopped
    environment:
      ConnectionStrings__HexCrawl: "Data Source=/data/hex-crawl.db"
      MapAssets__RootPath: "/data/assets"
      MapImport__MaxFileBytes: "104857600"
      MapImport__MaxPixelCount: "100000000"
      MapImport__MaxDimension: "32768"
      ToolHost__BaseUrl: "http://dorks-and-dice-site:8080"
    volumes:
      - hex-crawl-data:/data
    networks:
      - dorks-and-dice-backend

volumes:
  hex-crawl-data:

networks:
  dorks-and-dice-backend:
    external: true
