name: Phase 0B test compile fixes 2

on:
  push:
    branches: [ "feature/postgres-persistence" ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
          fetch-depth: 0

      - name: Apply remaining PostgreSQL test compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Overworld deletion fixture.
          path = Path('tests/HexCrawl.Application.Tests/OverworldDeletionTests.cs')
          text = path.read_text()
          start = text.index('    private sealed class TestDatabase : IAsyncDisposable\n')
          replacement = '''    private sealed class TestDatabase : IAsyncDisposable
    {
        private readonly PostgresTestDatabase _database;
        private string ConnectionString => _database.ConnectionString;

        private TestDatabase(PostgresTestDatabase database)
        {
            _database = database;
        }

        public static async Task<TestDatabase> CreateAsync()
        {
            var database = await PostgresTestDatabase.CreateAsync();
            var store = new PostgresHexCrawlStore(database.ConnectionString);
            await store.InitializeAsync();
            return new TestDatabase(database);
        }

        public async Task<HexCrawlService> ServiceAsync()
        {
            var store = new PostgresHexCrawlStore(ConnectionString);
            await store.InitializeAsync();
            return new HexCrawlService(store);
        }

        public ValueTask DisposeAsync() => _database.DisposeAsync();
    }
}
'''
          path.write_text(text[:start] + replacement)

          # Phase 0A origin regression test now uses PostgreSQL runtime persistence.
          path = Path('tests/HexCrawl.Application.Tests/ProcedurePresetIdentityTests.cs')
          text = path.read_text()
          old = '''        var path = Path.Combine(Path.GetTempPath(), $"hex-crawl-preset-origin-{Guid.NewGuid():N}.db");
        try
        {
            var store = new SqliteHexCrawlStore($"Data Source={path}");
            await store.InitializeAsync();
'''
          new = '''        await using var database = await PostgresTestDatabase.CreateAsync();
        {
            var store = new PostgresHexCrawlStore(database.ConnectionString);
            await store.InitializeAsync();
'''
          if old not in text: raise SystemExit('ProcedurePresetIdentity setup not found')
          text = text.replace(old, new, 1)
          old = '''        }
        finally
        {
            foreach (var suffix in new[] { "", "-wal", "-shm" })
            {
                var file = path + suffix;
                if (File.Exists(file)) File.Delete(file);
            }
        }
'''
          if old not in text: raise SystemExit('ProcedurePresetIdentity cleanup not found')
          text = text.replace(old, '        }\n', 1)
          path.write_text(text)

          # Rules Core campaign scope fixture.
          path = Path('tests/HexCrawl.Application.Tests/ProcedureResolutionRulesCoreAdapterTests.cs')
          text = path.read_text()
          old = '''        var databasePath = Path.Combine(
            Path.GetTempPath(),
            $"hex-crawl-rules-scope-{Guid.NewGuid():N}.db");
        try
        {
            var store = new SqliteHexCrawlStore($"Data Source={databasePath}");
            await store.InitializeAsync();
'''
          new = '''        await using var database = await PostgresTestDatabase.CreateAsync();
        {
            var store = new PostgresHexCrawlStore(database.ConnectionString);
            await store.InitializeAsync();
'''
          if old not in text: raise SystemExit('RulesCore campaign setup not found')
          text = text.replace(old, new, 1)
          old = '''        }
        finally
        {
            if (File.Exists(databasePath)) File.Delete(databasePath);
        }
'''
          if old not in text: raise SystemExit('RulesCore campaign cleanup not found')
          text = text.replace(old, '        }\n', 1)
          path.write_text(text)

          # Workbench shared fixture.
          path = Path('tests/HexCrawl.Application.Tests/ExpeditionWorkbenchTests.cs')
          text = path.read_text()
          start = text.index('    private sealed class TestDatabase : IAsyncDisposable\n')
          replacement = '''    private sealed class TestDatabase : IAsyncDisposable
    {
        private readonly PostgresTestDatabase _database;
        public string ConnectionString => _database.ConnectionString;

        private TestDatabase(PostgresTestDatabase database)
        {
            _database = database;
        }

        public static async Task<TestDatabase> CreateAsync()
        {
            var database = await PostgresTestDatabase.CreateAsync();
            var store = new PostgresHexCrawlStore(database.ConnectionString);
            await store.InitializeAsync();
            return new TestDatabase(database);
        }

        public async Task<ExpeditionAssistantService> AssistantServiceAsync()
        {
            var store = new PostgresHexCrawlStore(ConnectionString);
            await store.InitializeAsync();
            var core = new HexCrawlService(store);
            var resolver = new CrawlSessionContextResolver(core);
            return new ExpeditionAssistantService(store, core, resolver);
        }

        public async Task<(HexCrawlService Core, ExpeditionWorkbenchService Workbench)> ServicesAsync()
        {
            var store = new PostgresHexCrawlStore(ConnectionString);
            await store.InitializeAsync();
            var core = new HexCrawlService(store);
            var resolver = new CrawlSessionContextResolver(core);
            return (core, new ExpeditionWorkbenchService(store, core, resolver));
        }

        public ValueTask DisposeAsync() => _database.DisposeAsync();
    }
}
'''
          path.write_text(text[:start] + replacement)

          # Migration acceptance tests: xUnit NotNull is an assertion, not a value factory.
          path = Path('tests/HexCrawl.Application.Tests/PostgresPersistenceMigrationTests.cs')
          text = path.read_text()
          text = text.replace(
              '            var worldBound = Assert.NotNull(await store.GetExpeditionAsync(seeded.WorldBoundId, Owner));\n',
              '            var worldBound = await store.GetExpeditionAsync(seeded.WorldBoundId, Owner);\n            Assert.NotNull(worldBound);\n            worldBound = worldBound!;\n', 1)
          text = text.replace(
              '                var abstractHex = Assert.NotNull(await store.GetExpeditionAsync(seeded.AbstractHexId, Owner));\n                var nonSpatial = Assert.NotNull(await store.GetExpeditionAsync(seeded.NonSpatialId, Owner));\n',
              '                var abstractHex = await store.GetExpeditionAsync(seeded.AbstractHexId, Owner);\n                var nonSpatial = await store.GetExpeditionAsync(seeded.NonSpatialId, Owner);\n                Assert.NotNull(abstractHex);\n                Assert.NotNull(nonSpatial);\n                abstractHex = abstractHex!;\n                nonSpatial = nonSpatial!;\n', 1)
          text = text.replace(
              '        var generatedId = Guid.NewGuid();\n        var generated = new GeneratedProcedureResolution(\n',
              '        var spatialRuntime = (ExpeditionState)worldBound.Runtime;\n        var generatedId = Guid.NewGuid();\n        var generated = new GeneratedProcedureResolution(\n', 1)
          text = text.replace('            worldBound.Runtime.CompletedWatches + 1,\n', '            spatialRuntime.CompletedWatches + 1,\n', 1)
          text = text.replace(
              '        worldBound = Assert.NotNull(save.Value);\n',
              '        Assert.NotNull(save.Value);\n        worldBound = save.Value!;\n', 1)
          path.write_text(text)

          # PostgreSQL schema tests use current Domain record/object shapes.
          path = Path('tests/HexCrawl.Application.Tests/PostgresSchemaTests.cs')
          text = path.read_text()
          text = text.replace(
              '''                new WorldPoint(index / 10d, -(index / 20d)),
                LocationDiscoverability.Hidden))''',
              '''                new WorldPoint(index / 10d, -(index / 20d)),
                LocationDiscoverability.Hidden,
                []))''', 1)
          old = '''            Grid = new HexGridDefinition(
                HexOrientation.PointyTop,
                new WorldPoint(0, 0),
                0,
                1,
                new DistanceMeasure(12, DistanceUnit.Miles)),
'''
          new = '''            Grid = new HexGridDefinition
            {
                Id = Guid.NewGuid(),
                Orientation = HexOrientation.PointyTop,
                Origin = new WorldPoint(0, 0),
                RotationDegrees = 0,
                HexRadiusWorldUnits = 1,
                NeighborCenterDistance = new DistanceMeasure(12, DistanceUnit.Miles)
            },
'''
          if old not in text: raise SystemExit('PostgresSchema grid constructor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        var loaded = Assert.NotNull(await store.GetOverworldAsync(worldId, "large-owner"));\n',
              '        var loaded = await store.GetOverworldAsync(worldId, "large-owner");\n        Assert.NotNull(loaded);\n        loaded = loaded!;\n', 1)
          path.write_text(text)
          PY

          rm .github/workflows/phase0b-test-compile-fixes-2.yml
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix PostgreSQL test compilation'
          git push origin HEAD:feature/postgres-persistence
