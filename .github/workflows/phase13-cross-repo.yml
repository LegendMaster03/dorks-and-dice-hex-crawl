name: Phase 13 cross-repository proof

on:
  push:
    branches: [ "feature/phase-13-shared-map-processing" ]

permissions:
  contents: read

env:
  SURVEYOR_SHA: c6496875c6032f7b55ad8e02d997fdb9fba8c80b
  PHASE13_TOKEN: phase13-cross-repository-token-2026

jobs:
  integration-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Checkout exact Surveyor feature head
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/LegendMaster03/dorks-and-dice-surveyor.git "$RUNNER_TEMP/surveyor"
          git -C "$RUNNER_TEMP/surveyor" checkout --quiet "$SURVEYOR_SHA"
          test "$(git -C "$RUNNER_TEMP/surveyor" rev-parse HEAD)" = "$SURVEYOR_SHA"

      - name: Install fixture and client tooling
        run: |
          set -euo pipefail
          npm ci --prefix "$RUNNER_TEMP/surveyor" --no-audit --no-fund
          npm install --prefix src/HexCrawl.Web/Client --no-audit --no-fund
          mkdir -p src/HexCrawl.Web/Client/.phase13-legacy
          git show 2dfc4d999ad1b7b36701faac210b2e7d9beedd60:src/HexCrawl.Web/Client/src/grid-lattice-detector.ts \
            > src/HexCrawl.Web/Client/.phase13-legacy/grid-lattice-detector.ts
          (cd src/HexCrawl.Web/Client && npx tsc --ignoreConfig \
            .phase13-legacy/grid-lattice-detector.ts \
            --target ES2023 --module NodeNext --moduleResolution NodeNext \
            --outDir .phase13-legacy-dist)
          (cd src/HexCrawl.Web/Client && npx tsc --ignoreConfig \
            src/raster-grid-alignment.ts src/hex-grid-analysis.ts \
            --target ES2023 --module NodeNext --moduleResolution NodeNext \
            --outDir .phase13-preview-dist)

      - name: Generate redistributable parity fixtures and legacy expected result
        working-directory: ${{ runner.temp }}/surveyor
        run: |
          set -euo pipefail
          export HEX_REPO="$GITHUB_WORKSPACE"
          cat > "$RUNNER_TEMP/generate-phase13-fixtures.mjs" <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import sharp from './node_modules/sharp/lib/index.js';

          const legacyUrl = pathToFileURL(`${process.env.HEX_REPO}/src/HexCrawl.Web/Client/.phase13-legacy-dist/grid-lattice-detector.js`).href;
          const { detectHexLattice } = await import(legacyUrl);
          const radians = degrees => degrees * Math.PI / 180;
          const raster = (width, height, value = 224) => ({ width, height, pixels: new Uint8Array(width * height).fill(value) });
          function darkenPixel(image, x, y, value = 32) {
            const ix = Math.round(x), iy = Math.round(y);
            if (ix < 0 || iy < 0 || ix >= image.width || iy >= image.height) return;
            image.pixels[iy * image.width + ix] = Math.min(image.pixels[iy * image.width + ix], value);
          }
          function drawLine(image, start, end, value = 32, width = 1) {
            const steps = Math.max(1, Math.ceil(Math.hypot(end.x - start.x, end.y - start.y) * 1.5));
            for (let step = 0; step <= steps; step++) {
              const t = step / steps;
              const x = start.x + ((end.x - start.x) * t);
              const y = start.y + ((end.y - start.y) * t);
              for (let dy = -width; dy <= width; dy++) for (let dx = -width; dx <= width; dx++) {
                if ((dx * dx) + (dy * dy) <= width * width + 0.5) darkenPixel(image, x + dx, y + dy, value);
              }
            }
          }
          function renderHexGrid(image, { orientation, spacing, rotationDegrees = 0, anchor = { x: 0, y: 0 }, lineValue = 35 }) {
            const base = radians((orientation === 'PointyTop' ? 0 : 30) + rotationDegrees);
            const u = { x: spacing * Math.cos(base), y: spacing * Math.sin(base) };
            const v = { x: spacing * Math.cos(base + Math.PI / 3), y: spacing * Math.sin(base + Math.PI / 3) };
            const radius = spacing / Math.sqrt(3);
            const cornerStart = (orientation === 'PointyTop' ? -30 : 0) + rotationDegrees;
            const reach = Math.ceil(Math.hypot(image.width, image.height) / spacing) + 4;
            for (let i = -reach; i <= reach; i++) for (let j = -reach; j <= reach; j++) {
              const center = { x: anchor.x + i * u.x + j * v.x, y: anchor.y + i * u.y + j * v.y };
              if (center.x < -spacing || center.y < -spacing || center.x > image.width + spacing || center.y > image.height + spacing) continue;
              const corners = [];
              for (let corner = 0; corner < 6; corner++) {
                const angle = radians(cornerStart + corner * 60);
                corners.push({ x: center.x + radius * Math.cos(angle), y: center.y + radius * Math.sin(angle) });
              }
              for (let edge = 0; edge < 6; edge++) drawLine(image, corners[edge], corners[(edge + 1) % 6], lineValue, 1);
            }
          }
          function addMapNoise(image) {
            for (let y = 0; y < image.height; y++) for (let x = 0; x < image.width; x++) {
              const index = y * image.width + x;
              const variation = ((x * 17 + y * 29 + ((x * y) % 31)) % 29) - 14;
              image.pixels[index] = Math.max(0, Math.min(255, image.pixels[index] + variation));
            }
            drawLine(image, { x: 8, y: 13 }, { x: image.width - 18, y: image.height - 29 }, 58, 2);
            drawLine(image, { x: image.width * 0.72, y: 0 }, { x: image.width * 0.42, y: image.height }, 70, 2);
            drawLine(image, { x: 0, y: image.height * 0.63 }, { x: image.width, y: image.height * 0.56 }, 84, 1);
          }
          function replaceRightHalf(target, source) {
            const split = Math.floor(target.width / 2);
            for (let y = 0; y < target.height; y++) for (let x = split; x < target.width; x++) {
              target.pixels[y * target.width + x] = source.pixels[y * source.width + x];
            }
          }
          async function writePng(image, name) {
            await sharp(Buffer.from(image.pixels), { raw: { width: image.width, height: image.height, channels: 1 } }).png().toFile(`${process.env.RUNNER_TEMP}/${name}`);
          }

          const detected = raster(640, 480, 224);
          renderHexGrid(detected, { orientation: 'FlatTop', spacing: 30.001, rotationDegrees: 0, anchor: { x: 9.5, y: 11.25 }, lineValue: 48 });
          const legacy = detectHexLattice(detected, { minimumSpacingPixels: 12, minimumConfidence: 0.54 });
          if (legacy.status !== 'detected' || !legacy.fit) throw new Error(`Expected clean parity fixture to detect: ${legacy.reason}`);
          const residualLimit = Math.min(2.5, Math.max(1.5, legacy.fit.centerSpacingPixels * 0.025));
          if (legacy.fit.residualPixels > residualLimit) throw new Error(`Fixture is not automatic-Apply eligible: ${legacy.fit.residualPixels} > ${residualLimit}`);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/legacy-analysis.json`, JSON.stringify(legacy, null, 2));
          await writePng(detected, 'detected.png');

          const white = raster(320, 240, 224);
          await writePng(white, 'gridless.png');

          const drift = raster(640, 420, 220);
          const driftRight = raster(640, 420, 220);
          renderHexGrid(drift, { orientation: 'FlatTop', spacing: 30, anchor: { x: 8, y: 17 }, lineValue: 64 });
          renderHexGrid(driftRight, { orientation: 'FlatTop', spacing: 31, anchor: { x: 8, y: 17 }, lineValue: 64 });
          addMapNoise(drift); addMapNoise(driftRight); replaceRightHalf(drift, driftRight);
          await writePng(drift, 'inconclusive.png');
          NODE
          RUNNER_TEMP="$RUNNER_TEMP" node "$RUNNER_TEMP/generate-phase13-fixtures.mjs"

      - name: Build exact-head service containers
        run: |
          set -euo pipefail
          docker build -t phase13-surveyor:test "$RUNNER_TEMP/surveyor"
          docker build -t phase13-hex:test -f src/HexCrawl.Web/Dockerfile .

      - name: Start PostgreSQL, Surveyor, and Hex Crawl exact heads
        run: |
          set -euo pipefail
          docker network create phase13-proof
          docker run -d --name phase13-postgres --network phase13-proof \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=phase13 -e POSTGRES_PASSWORD=phase13 postgres:18 >/dev/null
          for i in {1..45}; do
            if docker exec phase13-postgres pg_isready -U phase13 -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec phase13-postgres psql -v ON_ERROR_STOP=1 -U phase13 -d postgres -c 'CREATE SCHEMA phase13;' >/dev/null
          docker run -d --name phase13-surveyor --network phase13-proof -p 127.0.0.1:18094:8080 \
            -e "SURVEYOR_SERVICE_TOKEN=$PHASE13_TOKEN" -e SURVEYOR_WORKER_COUNT=2 -e SURVEYOR_QUEUE_LIMIT=2 \
            phase13-surveyor:test >/dev/null
          docker run -d --name phase13-hex --network phase13-proof -p 127.0.0.1:18095:8080 \
            -e 'ConnectionStrings__HexCrawl=Host=phase13-postgres;Port=5432;Database=postgres;Username=phase13;Password=phase13;Search Path=phase13' \
            -e 'MapAssets__RootPath=/data/assets' \
            -e 'ToolHost__StandaloneIdentity__Enabled=true' \
            -e 'ToolHost__StandaloneIdentity__UserId=phase13-dm' \
            -e 'ToolHost__StandaloneIdentity__DisplayName=Phase 13 DM' \
            -e 'Surveyor__BaseUrl=http://phase13-surveyor:8080' \
            -e "Surveyor__ServiceToken=$PHASE13_TOKEN" \
            -e 'Surveyor__RequestTimeoutMilliseconds=35000' \
            phase13-hex:test >/dev/null
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18094/health/ready >/dev/null \
              && curl -fsS http://127.0.0.1:18095/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs phase13-surveyor || true
          docker logs phase13-hex || true
          exit 1

      - name: Prove legacy detector to Surveyor parity
        run: |
          set -euo pipefail
          curl -fsS -X POST 'http://127.0.0.1:18094/v1/hex-grid/detect?minimumSpacingPixels=12&minimumConfidence=0.54' \
            -H "Authorization: Bearer $PHASE13_TOKEN" -H 'Content-Type: image/png' \
            --data-binary "@$RUNNER_TEMP/detected.png" -o "$RUNNER_TEMP/surveyor-detected.json"
          python3 - "$RUNNER_TEMP/legacy-analysis.json" "$RUNNER_TEMP/surveyor-detected.json" <<'PY'
          import json, math, sys
          legacy=json.load(open(sys.argv[1])); remote=json.load(open(sys.argv[2]))
          assert remote['apiVersion']=='v1', remote
          assert remote['capability']=='map.hex-grid.detect', remote
          assert remote['status']==legacy['status']=='detected', (legacy,remote)
          a=legacy['fit']; b=remote['fit']; assert a and b
          assert a['orientation']==b['orientation']
          limits={
            'centerSpacingPixels':0.05,'rotationDegrees':0.05,'confidence':0.01,
            'residualPixels':0.05,'supportCoverage':0.01,'orientationSupport':0.01,
            'translationScore':0.01,'competingTranslationScore':0.01,
            'linePeriodicityScore':0.01,'phaseScore':0.01}
          for field,limit in limits.items():
            assert abs(a[field]-b[field]) <= limit, (field,a[field],b[field],limit)
          assert abs(a['anchorPixel']['x']-b['anchorPixel']['x']) <= 0.1
          assert abs(a['anchorPixel']['y']-b['anchorPixel']['y']) <= 0.1
          residual_limit=lambda spacing:min(2.5,max(1.5,spacing*0.025))
          legacy_apply=a['residualPixels'] <= residual_limit(a['centerSpacingPixels'])
          remote_apply=b['residualPixels'] <= residual_limit(b['centerSpacingPixels']) and remote['analysis']['sourceResolutionVerified']
          assert legacy_apply == remote_apply == True, (legacy_apply,remote_apply)
          report={
            'legacy':legacy,
            'surveyor':remote,
            'differences':{field:b[field]-a[field] for field in limits},
            'anchorDifference':{'x':b['anchorPixel']['x']-a['anchorPixel']['x'],'y':b['anchorPixel']['y']-a['anchorPixel']['y']},
            'automaticApplyEligible':remote_apply}
          json.dump(report,open(f'{__import__("os").environ["RUNNER_TEMP"]}/parity-report.json','w'),indent=2)
          PY

      - name: Prove Hex Crawl analysis, non-persistent preview, explicit Apply, gridless, and inconclusive states
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/phase13-http"
          mkdir -p "$response"
          curl -fsS -X POST http://127.0.0.1:18095/api/overworlds \
            -H 'Content-Type: application/json' \
            --data '{"name":"Phase 13 cross-repository proof","orientation":"PointyTop","origin":{"x":0,"y":0},"rotationDegrees":0,"hexRadiusWorldUnits":1,"neighborCenterDistance":12,"distanceUnit":{"kind":"Mile","symbol":"mi","metersPerUnit":1609.344}}' \
            -o "$response/world.json"
          world_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$response/world.json")"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$response/world.json")"

          upload() {
            local file="$1" name="$2" baked="$3" out="$4"
            curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps" \
              -F "file=@$file;type=image/png;filename=$name.png" \
              -F "name=$name" -F "geographyKey=$name" -F 'role=GM' \
              -F "containsBakedGrid=$baked" -F "expectedVersion=$version" -o "$out"
            version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$out")"
          }

          upload "$RUNNER_TEMP/detected.png" detected True "$response/upload-detected.json"
          detected_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceMaps"][-1]["id"])' "$response/upload-detected.json")"
          detected_version="$version"
          curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$detected_id/grid-analysis" -o "$response/hex-detected.json"
          python3 - "$RUNNER_TEMP/surveyor-detected.json" "$response/hex-detected.json" <<'PY'
          import json,sys
          direct=json.load(open(sys.argv[1])); through=json.load(open(sys.argv[2]))
          assert through['apiVersion']=='v1' and through['capability']=='map.hex-grid.detect'
          assert through['status']=='detected' and through['fit']
          for field in ('orientation','rotationDegrees','centerSpacingPixels','anchorPixel','confidence','residualPixels','supportCoverage','orientationSupport','translationScore','competingTranslationScore','linePeriodicityScore','phaseScore'):
            assert through['fit'][field] == direct['fit'][field], (field, through['fit'][field], direct['fit'][field])
          PY
          curl -fsS "http://127.0.0.1:18095/api/overworlds/$world_id" -o "$response/after-analysis.json"
          python3 - "$response/after-analysis.json" "$detected_version" "$detected_id" <<'PY'
          import json,sys
          w=json.load(open(sys.argv[1])); expected=int(sys.argv[2]); map_id=sys.argv[3]
          assert w['version']==expected, w
          m=next(m for m in w['sourceMaps'] if m['id']==map_id)
          assert m['alignment'] is None, m
          PY

          export ANALYSIS_JSON="$response/hex-detected.json" UPLOAD_JSON="$response/upload-detected.json" APPLY_JSON="$response/apply.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const moduleUrl=pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/HexCrawl.Web/Client/.phase13-preview-dist/raster-grid-alignment.js`).href;
          const { buildRasterGridAlignmentProposal } = await import(moduleUrl);
          const analysis=JSON.parse(fs.readFileSync(process.env.ANALYSIS_JSON));
          const world=JSON.parse(fs.readFileSync(process.env.UPLOAD_JSON));
          const sourceMap=world.sourceMaps.at(-1);
          const proposal=buildRasterGridAlignmentProposal(analysis.fit, world.grid, sourceMap.alignment ?? null, {
            pixelWidth: sourceMap.pixelWidth,
            pixelHeight: sourceMap.pixelHeight,
            authoritativeWorldUnitsPerPixel: null
          });
          fs.writeFileSync(process.env.APPLY_JSON, JSON.stringify({ expectedVersion: world.version, grid: proposal.grid, alignment: proposal.alignment }, null, 2));
          NODE
          curl -fsS -X PUT "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$detected_id/grid-alignment" \
            -H 'Content-Type: application/json' --data-binary "@$response/apply.json" -o "$response/applied.json"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$response/applied.json")"
          python3 - "$response/applied.json" "$detected_id" <<'PY'
          import json,sys
          w=json.load(open(sys.argv[1])); map_id=sys.argv[2]
          m=next(m for m in w['sourceMaps'] if m['id']==map_id)
          assert m['alignment'] is not None, m
          assert w['grid']['orientation']=='FlatTop', w['grid']
          PY

          upload "$RUNNER_TEMP/gridless.png" gridless False "$response/upload-gridless.json"
          gridless_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceMaps"][-1]["id"])' "$response/upload-gridless.json")"
          gridless_version="$version"
          curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$gridless_id/grid-analysis" -o "$response/gridless.json"
          python3 - "$response/gridless.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d['status']=='gridless' and d['fit'] is None, d
          PY
          curl -fsS "http://127.0.0.1:18095/api/overworlds/$world_id" -o "$response/after-gridless.json"
          python3 - "$response/after-gridless.json" "$gridless_version" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['version']==int(sys.argv[2])
          PY

          upload "$RUNNER_TEMP/inconclusive.png" inconclusive True "$response/upload-inconclusive.json"
          inconclusive_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceMaps"][-1]["id"])' "$response/upload-inconclusive.json")"
          inconclusive_version="$version"
          curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$inconclusive_id/grid-analysis" -o "$response/inconclusive.json"
          python3 - "$response/inconclusive.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d['status']=='inconclusive', d
          PY
          curl -fsS "http://127.0.0.1:18095/api/overworlds/$world_id" -o "$response/after-inconclusive.json"
          python3 - "$response/after-inconclusive.json" "$inconclusive_version" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['version']==int(sys.argv[2])
          PY
          printf '%s\n' "$world_id" "$detected_id" "$version" > "$response/ids.txt"

      - name: Prove unavailable, retry, authentication, and timeout failures cause no mutation
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/phase13-http"
          mapfile -t ids < "$response/ids.txt"
          world_id="${ids[0]}"; detected_id="${ids[1]}"; expected_version="${ids[2]}"

          docker stop phase13-surveyor >/dev/null
          code="$(curl -sS -o "$response/unavailable.json" -w '%{http_code}' -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$detected_id/grid-analysis")"
          test "$code" = 503
          docker start phase13-surveyor >/dev/null
          for i in {1..30}; do curl -fsS http://127.0.0.1:18094/health/ready >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$detected_id/grid-analysis" -o "$response/retry.json"
          python3 - "$response/retry.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['status']=='detected'
          PY

          docker run -d --name phase13-hex-bad-auth --network phase13-proof -p 127.0.0.1:18096:8080 \
            -e 'ConnectionStrings__HexCrawl=Host=phase13-postgres;Port=5432;Database=postgres;Username=phase13;Password=phase13;Search Path=phase13' \
            -e 'MapAssets__RootPath=/data/assets' \
            -e 'ToolHost__StandaloneIdentity__Enabled=true' -e 'ToolHost__StandaloneIdentity__UserId=phase13-dm' \
            -e 'Surveyor__BaseUrl=http://phase13-surveyor:8080' -e 'Surveyor__ServiceToken=deliberately-wrong-service-token' \
            phase13-hex:test >/dev/null
          for i in {1..45}; do curl -fsS http://127.0.0.1:18096/ready >/dev/null 2>&1 && break; sleep 1; done
          code="$(curl -sS -o "$response/auth-failure.json" -w '%{http_code}' -X POST "http://127.0.0.1:18096/api/overworlds/$world_id/source-maps/$detected_id/grid-analysis")"
          test "$code" = 502
          docker rm -f phase13-hex-bad-auth >/dev/null

          docker run -d --name phase13-surveyor-timeout --network phase13-proof \
            -e "SURVEYOR_SERVICE_TOKEN=$PHASE13_TOKEN" -e SURVEYOR_WORKER_COUNT=1 -e SURVEYOR_QUEUE_LIMIT=1 -e SURVEYOR_ANALYSIS_TIMEOUT=1 \
            phase13-surveyor:test >/dev/null
          docker run -d --name phase13-hex-timeout --network phase13-proof -p 127.0.0.1:18097:8080 \
            -e 'ConnectionStrings__HexCrawl=Host=phase13-postgres;Port=5432;Database=postgres;Username=phase13;Password=phase13;Search Path=phase13' \
            -e 'MapAssets__RootPath=/data/assets' \
            -e 'ToolHost__StandaloneIdentity__Enabled=true' -e 'ToolHost__StandaloneIdentity__UserId=phase13-dm' \
            -e 'Surveyor__BaseUrl=http://phase13-surveyor-timeout:8080' -e "Surveyor__ServiceToken=$PHASE13_TOKEN" \
            -e 'Surveyor__RequestTimeoutMilliseconds=35000' \
            phase13-hex:test >/dev/null
          for i in {1..45}; do curl -fsS http://127.0.0.1:18097/ready >/dev/null 2>&1 && break; sleep 1; done
          code="$(curl -sS -o "$response/timeout.json" -w '%{http_code}' -X POST "http://127.0.0.1:18097/api/overworlds/$world_id/source-maps/$detected_id/grid-analysis")"
          test "$code" = 504

          curl -fsS "http://127.0.0.1:18095/api/overworlds/$world_id" -o "$response/after-failures.json"
          python3 - "$response/after-failures.json" "$expected_version" <<'PY'
          import json,sys
          w=json.load(open(sys.argv[1])); assert w['version']==int(sys.argv[2]), (w['version'],sys.argv[2])
          PY

      - name: Phase 13 architecture audit
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/phase13-audit.txt"
          : > "$report"
          echo '=== Hex Crawl production browser forbidden analysis terms ===' >> "$report"
          if git grep -n -E 'detectHexLattice|grid-lattice-detector|GrayscaleRaster|mapDetectionToSourceImage|RasterGridAnalysisMaximumDimension' -- src/HexCrawl.Web/Client/src >> "$report"; then
            echo 'Forbidden browser analysis implementation remains.' >&2; cat "$report"; exit 1
          fi
          echo 'none' >> "$report"
          echo '=== Hex Crawl browser Surveyor coupling ===' >> "$report"
          if git grep -n -E 'Surveyor|SURVEYOR_SERVICE_TOKEN|/v1/hex-grid/detect' -- src/HexCrawl.Web/Client/src >> "$report"; then
            echo 'Browser contains Surveyor transport/credential coupling.' >&2; cat "$report"; exit 1
          fi
          echo 'none' >> "$report"
          echo '=== Browser image APIs retained for rendering/preview classification ===' >> "$report"
          git grep -n -E 'createImageBitmap|getImageData' -- src/HexCrawl.Web/Client/src >> "$report" || true
          echo '=== Hex Crawl service/client expected transport terms ===' >> "$report"
          git grep -n -E 'IMapAnalysis|HttpClient|Authorization|Bearer|timeout|source-map|Wonderdraft|image/png|image/jpeg|image/webp' -- src/HexCrawl.Application src/HexCrawl.Web >> "$report" || true
          echo '=== Surveyor forbidden Hex Crawl domain dependencies ===' >> "$report"
          if git -C "$RUNNER_TEMP/surveyor" grep -n -E 'Overworld|GridDefinition|CampaignProcedure|Expedition|SourceMapDetail|WorldPoint|HexCrawl\.' -- src >> "$report"; then
            echo 'Surveyor imports or embeds Hex Crawl domain state.' >&2; cat "$report"; exit 1
          fi
          echo 'none' >> "$report"
          echo '=== Surveyor network fetching ===' >> "$report"
          if git -C "$RUNNER_TEMP/surveyor" grep -n -E '\bfetch\(' -- src >> "$report"; then
            echo 'Surveyor contains arbitrary outbound fetch behavior.' >&2; cat "$report"; exit 1
          fi
          echo 'none' >> "$report"
          echo '=== Surveyor worker/queue/timeout/auth/image support ===' >> "$report"
          git -C "$RUNNER_TEMP/surveyor" grep -n -E 'worker|queue|timeout|Authorization|Bearer|image/png|image/jpeg|image/webp|limitInputPixels|SURVEYOR_MAX_UPLOAD_BYTES|SURVEYOR_MAX_PIXELS' -- src README.md docs >> "$report" || true
          echo '=== Surveyor future semantic non-goals ===' >> "$report"
          git -C "$RUNNER_TEMP/surveyor" grep -n -E 'terrain|road|OCR|semantic|Wonderdraft' -- src README.md docs >> "$report" || true
          cp "$report" "$RUNNER_TEMP/phase13-http/architecture-audit.txt"

      - name: Upload Phase 13 proof report
        uses: actions/upload-artifact@v4
        with:
          name: phase13-cross-repository-proof
          path: |
            ${{ runner.temp }}/parity-report.json
            ${{ runner.temp }}/phase13-http/*.json
            ${{ runner.temp }}/phase13-http/architecture-audit.txt
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          docker rm -f phase13-hex-timeout phase13-surveyor-timeout phase13-hex-bad-auth phase13-hex phase13-surveyor phase13-postgres 2>/dev/null || true
          docker network rm phase13-proof 2>/dev/null || true
