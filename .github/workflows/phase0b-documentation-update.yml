name: Phase 0B documentation update

on:
  push:
    branches: [ "feature/postgres-persistence" ]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
          fetch-depth: 0

      - name: Update PostgreSQL persistence documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arch = Path('docs/architecture.md')
          text = arch.read_text()
          text = text.replace(
              '- `HexCrawl.Infrastructure` implements SQLite persistence, filesystem map assets, and Tool Host authentication redemption.',
              '- `HexCrawl.Infrastructure` implements PostgreSQL persistence through Npgsql and hand-written SQL, filesystem map assets, and Tool Host authentication redemption.')
          old = '''SQLite remains behind `IHexCrawlStore`. Production uses `Data Source=/data/hex-crawl.db` on the existing `hex-crawl-data` volume. Forward schema migrations are tracked in `schema_migrations`; startup does not destructively recreate production data.\n\n`overworlds` stores owner identity, stable ID, aggregate version/timestamps, and a serialized world snapshot containing grid, semantic geometry, locations, and source-map metadata. Binary raster data is not stored in SQLite.\n'''
          new = '''PostgreSQL remains behind `IHexCrawlStore`; application/domain code has no Npgsql dependency. Production requires `ConnectionStrings__HexCrawl` and does not fall back to SQLite. `PostgresSchemaMigrator` tracks deterministic schema generations in `hex_crawl_schema_migrations`, applies migrations transactionally under a PostgreSQL advisory lock, and fails startup/readiness rather than recreating data when schema initialization can not complete.\n\n`overworlds` stores owner identity, stable UUID, aggregate version/timestamps, and a `jsonb` world snapshot containing grid, semantic geometry, locations, and source-map metadata. `expeditions` and `expedition_events` retain the same aggregate-snapshot plus ordered-history semantics using PostgreSQL-native UUID, bigint, timestamptz, and jsonb columns. Binary raster data is not stored in PostgreSQL.\n'''
          if old not in text: raise SystemExit('architecture persistence paragraph not found')
          text = text.replace(old, new, 1)
          text = text.replace('''The production layout is conceptually:\n\n```text\n/data/hex-crawl.db\n/data/assets/maps/...\n```''', '''The production storage layout is conceptually:\n\n```text\nPostgreSQL: structured Hex Crawl aggregate state and ordered event history\n/data/assets/maps/...: filesystem-backed raster/source-map assets\n/data/hex-crawl.db: retained legacy SQLite rollback artifact during cutover\n```''')
          old = '''The existing `expeditions` table remains the persistence envelope for compatibility, but its aggregate is now a crawl session rather than an inherently world-bound expedition. Schema version 2 adds required `context_json`, makes `overworld_id` nullable, and makes `knowledge_json` nullable.\n'''
          new = '''The PostgreSQL `expeditions` table remains the persistence envelope for compatibility, but its aggregate is a crawl session rather than an inherently world-bound expedition. The PostgreSQL schema starts from the fully materialized current shape: required `context_json`, nullable `overworld_id`, nullable world-only `knowledge_json`, party state, generated resolutions, executable procedure snapshot, nullable procedure-origin metadata, pause state, and remaining-watch state.\n'''
          if old not in text: raise SystemExit('architecture crawl-session paragraph not found')
          text = text.replace(old, new, 1)
          text = text.replace('''Existing schema-v1 expedition rows migrate to explicit `WorldBound` contexts; no placeholder worlds or magic IDs are introduced. Runtime history remains in `expedition_events`; persistence is snapshot + retained history, not event sourcing.''', '''The one-time SQLite importer supports legacy SQLite schema generations 1 through 5 without upgrading the source database in place. Schema-v1 expedition rows are projected to explicit `WorldBound` contexts from their existing real Overworld IDs; schemas before party/generated-resolution/procedure-origin columns receive only the same deterministic defaults introduced by those historical migrations. Missing procedure-origin metadata remains `NULL`. Runtime history remains in `expedition_events`; persistence is snapshot + retained history, not event sourcing.''')
          text = text.replace('''World-bound creation accepts a procedure preset key, a presentation preset key, and an optional complete procedure snapshot. Standalone creation accepts either an `AbstractHex` context (name, orientation, physical center distance/unit, starting hex) or a `NonSpatial` context (name only). The procedure snapshot must retain the selected preset key as provenance and passes the same domain validation as built-in profiles.''', '''World-bound creation accepts a procedure preset key, a presentation preset key, and an optional complete procedure snapshot. Standalone creation accepts either an `AbstractHex` context (name, orientation, physical center distance/unit, starting hex) or a `NonSpatial` context (name only). The executable procedure snapshot may use its own compatibility key/name and passes the same domain validation as built-in profiles; selected-preset provenance is stored separately as optional `ProcedureOriginMetadata`.''')
          text = text.replace('''`StoredExpedition.ProcedureOrigin` is nullable informational provenance (`presetKey`, display name, and revision). Schema v5 stores it separately in nullable `procedure_origin_json`. Existing schema-v4 rows migrate forward with `NULL` origin metadata and retain their existing `procedure_json` unchanged. Removing the metadata or removing the corresponding preset from the catalog does not change executable behavior.''', '''`StoredExpedition.ProcedureOrigin` is nullable informational provenance (`presetKey`, display name, and revision). PostgreSQL stores it separately in nullable `procedure_origin_json`. The legacy SQLite importer reads that column when present and imports `NULL` when it is absent; it does not invent provenance. Removing the metadata or removing the corresponding preset from the catalog does not change executable behavior.''')
          arch.write_text(text)

          host = Path('docs/tool-hosting.md')
          text = host.read_text()
          text = text.replace('''The standalone container smoke test uses an explicit development identity and deployment-owned SQLite volume. It verifies health/readiness, direct deep-route shell refresh, creates a persisted overworld, destroys/restarts the application container against the same volume, and confirms that the overworld is still present.''', '''The standalone container smoke test uses an explicit development identity, an isolated ephemeral PostgreSQL instance, and a filesystem asset directory. It requires `/health`, PostgreSQL-aware `/ready`, and frontend availability; creates persisted world/session data and a raster asset; restarts both the application and PostgreSQL; and confirms structured state and the filesystem asset survive the restart sequence.''')
          text = text.replace('''Persistent SQLite state is deployment-owned. Production Compose mounts the named `hex-crawl-data` volume at `/data` and sets `ConnectionStrings__HexCrawl=Data Source=/data/hex-crawl.db`. Replacing the application container during deployment does not remove that named volume, so application state survives normal redeployment. Credentials and machine-specific source-map paths remain outside the repository; future large map assets continue to use logical `AssetKey` references until a separate asset-storage provider is selected.''', '''Structured Hex Crawl state is PostgreSQL-backed. Production Compose requires `ConnectionStrings__HexCrawl` from the server-side environment file and does not define a permanent PostgreSQL container because production uses the platform/shared database arrangement. The named `hex-crawl-data` volume remains mounted at `/data` for `/data/assets` and for retaining the legacy `hex-crawl.db` rollback artifact during cutover. Replacing the application container therefore does not remove raster/source-map assets. Database credentials and machine-specific configuration remain outside the repository.''')
          host.write_text(text)

          modular = Path('docs/modular-architecture.md')
          text = modular.read_text().replace(
              '5. Evaluate whether the physically separated SQLite aggregate operations should eventually become independent stores. Keep `IHexCrawlStore` as the compatibility boundary until a narrower contract provides a concrete benefit; do not change storage semantics merely for type count.',
              '5. Evaluate whether the physically separated PostgreSQL aggregate operations should eventually become independent stores. Keep `IHexCrawlStore` as the compatibility boundary until a narrower contract provides a concrete benefit; do not change storage semantics merely for type count.')
          modular.write_text(text)

          source = Path('docs/source-map-import.md')
          text = source.read_text()
          text = text.replace('''```text\n/data/hex-crawl.db\n/data/assets/maps/...\n/data/assets/.tmp/...\n```''', '''```text\n/data/assets/maps/...\n/data/assets/.tmp/...\n/data/hex-crawl.db  # retained only as the legacy rollback artifact during PostgreSQL cutover\n```''')
          text = text.replace('Raster assets and opaque import source archives are stored through this boundary and are never stored as SQLite blobs.', 'Raster assets and opaque import source archives are stored through this boundary and are never stored as PostgreSQL blobs.')
          text = text.replace('Binary storage and SQLite metadata are not treated as a distributed transaction.', 'Filesystem binary storage and PostgreSQL metadata are not treated as a distributed transaction.')
          source.write_text(text)

          dm = Path('docs/dm-expedition-workbench.md')
          text = dm.read_text()
          start = text.index('## Persistence and restart behavior\n')
          end = text.index('\n## Explicitly deferred work\n', start)
          replacement = '''## Persistence and restart behavior\n\nProduction persistence is PostgreSQL through `PostgresHexCrawlStore`; `IHexCrawlStore` remains the application boundary. The PostgreSQL `expeditions` table stores required context, nullable world reference and world-only knowledge, party state, generated procedure resolutions, the complete executable procedure snapshot, nullable procedure-origin metadata, discriminated runtime state, pause reason, remaining watch time, aggregate version, and timestamps. Ordered runtime history remains in `expedition_events`.\n\nThe one-time SQLite importer accepts legacy schema generations 1 through 5. Schema-v1 rows are deterministically projected to `WorldBound` from their existing Overworld IDs; pre-v3 rows receive the historical empty party state; pre-v4 rows receive an empty generated-resolution list; and databases without `procedure_origin_json` import `NULL` origin metadata. The source SQLite database is read as-is and is not upgraded or deleted.\n\nValidation uses PostgreSQL for application persistence tests, HTTP integration tests, and container restart smokes. The mapped smoke persists a world, source-map asset, expedition, procedure snapshot/origin, and runtime advancement; then restarts PostgreSQL and the application before reloading the same state and binary asset. A separate mapless smoke persists and reloads a true `NonSpatial` session through PostgreSQL without creating an Overworld. `/ready` must report `postgresql-ready`; process health alone is not sufficient.\n\nThe production cutover remains operator-controlled: stop writes, back up `hex-crawl.db`, initialize PostgreSQL, run the migration and semantic verification utility, switch the server-side connection string, verify `/health` and `/ready`, perform deployed read/behavior checks, and retain both the SQLite backup and `hex-crawl-data` volume for rollback. See `docs/postgresql-persistence.md`.\n'''
          dm.write_text(text[:start] + replacement + text[end:])

          plan = Path('docs/generic-procedure-development-plan.md')
          text = plan.read_text()
          start = text.index('## Phase 0 — separate preset identity from execution\n')
          end = text.index('\n## Phase 1 — generic procedure and preset foundation\n', start)
          replacement = '''## Phase 0 — compatibility normalization before generic procedure composition\n\nPhase 0 is a compatibility-focused migration stage that must complete before the broader generic module system. It has two separately reviewable checkpoints that combine for the final Phase 0 review. Neither checkpoint changes game/runtime behavior.\n\n### Phase 0A — separate preset identity from execution\n\nGoal: separate creation-time preset identity from executable procedure state while retaining `CrawlProcedureProfile` as the compatibility projection consumed by the deterministic runtime.\n\nRequired work:\n\n1. Introduce a preset/catalog concept outside the executable Domain procedure model.\n2. Introduce nullable informational `ProcedureOriginMetadata`.\n3. Move named-system construction out of `CrawlProcedureProfile` Domain factories.\n4. Remove the invariant that a customized executable procedure key must equal the selected preset key.\n5. Persist the complete executable snapshot independently of origin metadata.\n6. Prove an expedition remains executable if its originating preset or origin metadata disappears.\n7. Keep Rules Core optional and avoid runtime catalog re-resolution.\n8. Preserve old persisted shapes and add regression coverage.\n\nPhase 0A is implemented on its dedicated checkpoint branch and remains the behavioral base for Phase 0B.\n\n### Phase 0B — normalize production persistence on PostgreSQL\n\nGoal: move structured Hex Crawl production persistence from SQLite to PostgreSQL without redesigning the domain, application contracts, or runtime.\n\nRequired work:\n\n1. Keep `IHexCrawlStore` as the application persistence boundary and implement it with Npgsql plus hand-written PostgreSQL SQL; do not introduce Entity Framework merely for platform consistency.\n2. Use PostgreSQL-native UUID, bigint, timestamptz, boolean where applicable, and structured JSON storage while retaining complete aggregate snapshots rather than normalizing runtime/domain state into relational tables.\n3. Preserve atomic optimistic concurrency, owner scoping, foreign-key/delete semantics, deterministic ordering, and atomic snapshot-plus-history persistence.\n4. Add deterministic, idempotent, transactional, version-tracked PostgreSQL schema initialization that fails clearly instead of resetting production data.\n5. Provide a one-time read-only SQLite → PostgreSQL migration capability supporting deployed historical SQLite generations, including databases with and without `procedure_origin_json`. Missing origin is valid and must remain missing.\n6. Preserve IDs, owners, versions, timestamps, world/source-map metadata, every crawl-session snapshot field, every retained event and sequence, AutomaticRoll/provenance records, and all existing relationships.\n7. Verify migration semantically: row counts, IDs, versions, event order/uniqueness, relationships, snapshot equality, and real application-path deserialization/read behavior.\n8. Keep raster/source-map binaries filesystem-backed through `IMapAssetStore` at `/data/assets`; the existing data volume remains required and the legacy SQLite database remains a rollback artifact during cutover.\n9. Make `/ready` verify PostgreSQL connectivity/schema readiness while `/health` remains process health.\n10. Make normal CI, container restart tests, deployment smoke tests, Compose configuration, and deployment use PostgreSQL rather than SQLite.\n11. Re-prove every Phase 0A preset-origin invariant on the combined branch.\n12. Document the operator-controlled backup, migration, verification, cutover, and rollback sequence.\n\n### Phase 0 non-goals\n\n- Do not rewrite `CrawlRuntimeEngine`.\n- Do not introduce the full module/mechanic dependency graph.\n- Do not implement new published-system presets.\n- Do not remove optional Rules Core travel/environment support.\n- Do not implement the generalized effect/resource engine.\n- Do not change battle-map ownership.\n- Do not modify raster/grid alignment algorithms.\n- Do not merge to `main` without explicit authorization.\n\nPhase 1 begins only after the combined Phase 0A + Phase 0B result is reviewed and explicitly authorized for merge.\n'''
          plan.write_text(text[:start] + replacement + text[end:])
          PY

          rm .github/workflows/phase0b-documentation-update.yml
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Document PostgreSQL persistence and Phase 0B'
          git push origin HEAD:feature/postgres-persistence
