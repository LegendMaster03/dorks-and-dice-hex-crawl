name: Finalize Phase 0B fixes

on:
  push:
    branches:
      - feature/postgres-persistence

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
          fetch-depth: 0

      - name: Incorporate current main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply final compile fix
        run: python3 scripts/phase0b-final-compile-fix.py

      - name: Commit fixes and remove one-shot helpers
        run: |
          rm -f scripts/phase0b-final-compile-fix.py
          rm -f .github/workflows/phase0b-finalize-fixes.yml
          git diff --check
          git add -A
          git commit -m "Finish PostgreSQL migration test compilation"
          git push origin HEAD:feature/postgres-persistence
