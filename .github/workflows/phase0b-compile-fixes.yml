name: Phase 0B compile fixes

on:
  push:
    branches: [ "feature/postgres-persistence" ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
          fetch-depth: 0

      - name: Apply compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('tools/HexCrawl.PersistenceMigration/SqliteToPostgresMigrator.cs')
          text = migration.read_text()
          old = 'var overworldId = reader.IsDBNull(1) ? null : Guid.Parse(reader.GetString(1));'
          new = 'Guid? overworldId = reader.IsDBNull(1) ? null : Guid.Parse(reader.GetString(1));'
          if old not in text:
              raise SystemExit('migration nullable Guid target not found')
          migration.write_text(text.replace(old, new, 1))

          test = Path('tests/HexCrawl.IntegrationTests/ExpeditionDeletionEndpointsTests.cs')
          text = test.read_text()
          text = text.replace('using Microsoft.Data.Sqlite;', 'using Npgsql;\nusing NpgsqlTypes;')
          text = text.replace('new SqliteConnection($"Data Source={database}")', 'new NpgsqlConnection(database)')
          text = text.replace('command.Parameters.AddWithValue("$expedition", expeditionId.ToString("D"));', 'command.Parameters.AddWithValue("expedition", NpgsqlDbType.Uuid, expeditionId);')
          text = text.replace('command.Parameters.AddWithValue("$id", expeditionId.ToString("D"));', 'command.Parameters.AddWithValue("id", NpgsqlDbType.Uuid, expeditionId);')
          text = text.replace('command.Parameters.AddWithValue("$id", id.ToString("D"));', 'command.Parameters.AddWithValue("id", NpgsqlDbType.Uuid, id);')
          text = text.replace('VALUES($expedition, 999999,', 'VALUES(@expedition, 999999,')
          text = text.replace('WHERE id = $id;', 'WHERE id = @id;')
          text = text.replace('WHERE {keyColumn} = $id;', 'WHERE {keyColumn} = @id;')
          test.write_text(text)
          PY

          rm .github/workflows/phase0b-compile-fixes.yml
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix PostgreSQL persistence compilation'
          git push origin HEAD:feature/postgres-persistence
