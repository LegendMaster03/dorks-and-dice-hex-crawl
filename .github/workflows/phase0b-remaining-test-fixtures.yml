name: Phase 0B remaining PostgreSQL fixtures

on:
  push:
    branches: [ "feature/postgres-persistence" ]

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
          fetch-depth: 0

      - name: Convert remaining SQLite-only test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('tests/HexCrawl.Application.Tests/PostgresTestDatabase.cs')
          text = helper.read_text()
          text = text.replace(
              '''    public static async Task<PostgresTestDatabase> CreateAsync(CancellationToken cancellationToken = default)\n    {\n        var adminConnectionString = Environment.GetEnvironmentVariable("HEXCRAWL_TEST_POSTGRES")\n            ?? "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres";\n        var schema = $"hex_test_{Guid.NewGuid():N}";\n''',
              '''    public static async Task<PostgresTestDatabase> CreateAsync(CancellationToken cancellationToken = default)\n    {\n        var adminConnectionString = BaseConnectionString();\n        var schema = $"hex_test_{Guid.NewGuid():N}";\n''')
          insert = '''\n    public static string CreateConnectionString()\n    {\n        var adminConnectionString = BaseConnectionString();\n        var schema = $"hex_test_{Guid.NewGuid():N}";\n        using (var connection = new NpgsqlConnection(adminConnectionString))\n        {\n            connection.Open();\n            using var command = connection.CreateCommand();\n            command.CommandText = $"CREATE SCHEMA \\\"{schema}\\\";";\n            command.ExecuteNonQuery();\n        }\n\n        return new NpgsqlConnectionStringBuilder(adminConnectionString)\n        {\n            SearchPath = schema\n        }.ConnectionString;\n    }\n\n    public static void Delete(string connectionString)\n    {\n        var builder = new NpgsqlConnectionStringBuilder(connectionString);\n        var schema = builder.SearchPath;\n        if (string.IsNullOrWhiteSpace(schema))\n        {\n            throw new ArgumentException("The PostgreSQL test connection string must identify its isolated schema.", nameof(connectionString));\n        }\n\n        builder.SearchPath = string.Empty;\n        using var connection = new NpgsqlConnection(builder.ConnectionString);\n        connection.Open();\n        using var command = connection.CreateCommand();\n        command.CommandText = $"DROP SCHEMA IF EXISTS \\\"{schema}\\\" CASCADE;";\n        command.ExecuteNonQuery();\n    }\n\n    private static string BaseConnectionString() =>\n        Environment.GetEnvironmentVariable("HEXCRAWL_TEST_POSTGRES")\n        ?? "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres";\n'''
          marker = '\n    public async ValueTask DisposeAsync()\n'
          if marker not in text:
              raise SystemExit('PostgresTestDatabase insertion marker not found')
          text = text.replace(marker, insert + marker, 1)
          helper.write_text(text)

          deletion = Path('tests/HexCrawl.Application.Tests/ExpeditionDeletionTests.cs')
          text = deletion.read_text()
          start = text.index('    private sealed class TestDatabase : IAsyncDisposable\n')
          replacement = '''    private sealed class TestDatabase : IAsyncDisposable\n    {\n        private readonly PostgresTestDatabase _database;\n\n        private TestDatabase(PostgresTestDatabase database, PostgresHexCrawlStore store)\n        {\n            _database = database;\n            Store = store;\n            Service = new HexCrawlService(store);\n        }\n\n        public PostgresHexCrawlStore Store { get; }\n        public HexCrawlService Service { get; }\n\n        public static async Task<TestDatabase> CreateAsync()\n        {\n            var database = await PostgresTestDatabase.CreateAsync();\n            var store = new PostgresHexCrawlStore(database.ConnectionString);\n            await store.InitializeAsync();\n            return new TestDatabase(database, store);\n        }\n\n        public ValueTask DisposeAsync() => _database.DisposeAsync();\n    }\n}\n'''
          deletion.write_text(text[:start] + replacement)

          raster = Path('tests/HexCrawl.Application.Tests/RasterGridAlignmentTests.cs')
          text = raster.read_text()
          old = '''    private static string TemporaryDatabasePath() =>\n        Path.Combine(Path.GetTempPath(), $"hex-crawl-raster-grid-{Guid.NewGuid():N}.db");\n\n    private static async Task<SqliteHexCrawlStore> OpenStoreAsync(string path)\n    {\n        var store = new SqliteHexCrawlStore($"Data Source={path}");\n        await store.InitializeAsync();\n        return store;\n    }\n\n    private static void DeleteDatabase(string path)\n    {\n        foreach (var candidate in new[] { path, path + "-wal", path + "-shm" })\n        {\n            if (File.Exists(candidate)) File.Delete(candidate);\n        }\n    }\n'''
          new = '''    private static string TemporaryDatabasePath() => PostgresTestDatabase.CreateConnectionString();\n\n    private static async Task<PostgresHexCrawlStore> OpenStoreAsync(string path)\n    {\n        var store = new PostgresHexCrawlStore(path);\n        await store.InitializeAsync();\n        return store;\n    }\n\n    private static void DeleteDatabase(string path) => PostgresTestDatabase.Delete(path);\n'''
          if old not in text:
              raise SystemExit('RasterGridAlignmentTests helper block not found')
          raster.write_text(text.replace(old, new, 1))

          preservation = Path('tests/HexCrawl.Application.Tests/RasterGridAlignmentRecordPreservationTests.cs')
          text = preservation.read_text()
          text = text.replace(
              'var path = Path.Combine(Path.GetTempPath(), $"hex-crawl-grid-records-{Guid.NewGuid():N}.db");',
              'var path = PostgresTestDatabase.CreateConnectionString();',
              1)
          old = '''    private static async Task<SqliteHexCrawlStore> OpenStoreAsync(string path)\n    {\n        var store = new SqliteHexCrawlStore($"Data Source={path}");\n        await store.InitializeAsync();\n        return store;\n    }\n\n    private static void DeleteDatabase(string path)\n    {\n        foreach (var candidate in new[] { path, path + "-wal", path + "-shm" })\n        {\n            if (File.Exists(candidate)) File.Delete(candidate);\n        }\n    }\n'''
          new = '''    private static async Task<PostgresHexCrawlStore> OpenStoreAsync(string path)\n    {\n        var store = new PostgresHexCrawlStore(path);\n        await store.InitializeAsync();\n        return store;\n    }\n\n    private static void DeleteDatabase(string path) => PostgresTestDatabase.Delete(path);\n'''
          if old not in text:
              raise SystemExit('RecordPreservation helper block not found')
          preservation.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/phase0b-remaining-test-fixtures.yml
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Move remaining persistence fixtures to PostgreSQL'
          git push origin HEAD:feature/postgres-persistence
