name: Phase 13 failure-boundary proof

on:
  push:
    branches: [ "feature/phase-13-shared-map-processing" ]

permissions:
  contents: read

jobs:
  failure-boundary-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PHASE13_TOKEN: phase13-cross-repository-proof-token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Surveyor head
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/LegendMaster03/dorks-and-dice-surveyor.git "$RUNNER_TEMP/surveyor"
          git -C "$RUNNER_TEMP/surveyor" checkout --quiet c6496875c6032f7b55ad8e02d997fdb9fba8c80b
          test "$(git -C "$RUNNER_TEMP/surveyor" rev-parse HEAD)" = c6496875c6032f7b55ad8e02d997fdb9fba8c80b

      - name: Build exact-head containers
        run: |
          set -euo pipefail
          docker build -t phase13-surveyor:test "$RUNNER_TEMP/surveyor"
          docker build -t phase13-hex:test -f src/HexCrawl.Web/Dockerfile .

      - name: Start shared infrastructure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase13-data" "$RUNNER_TEMP/phase13-proof"
          docker network create phase13-proof
          docker run -d --name phase13-postgres --network phase13-proof \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=phase13 -e POSTGRES_PASSWORD=phase13 postgres:18 >/dev/null
          for i in {1..45}; do
            if docker exec phase13-postgres pg_isready -U phase13 -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec phase13-postgres psql -v ON_ERROR_STOP=1 -U phase13 -d postgres -c 'CREATE SCHEMA phase13_failure;' >/dev/null
          docker run -d --name phase13-surveyor --network phase13-proof -p 127.0.0.1:18094:8080 \
            -e "SURVEYOR_SERVICE_TOKEN=$PHASE13_TOKEN" -e SURVEYOR_WORKER_COUNT=2 -e SURVEYOR_QUEUE_LIMIT=2 phase13-surveyor:test >/dev/null
          docker run -d --name phase13-hex --network phase13-proof -p 127.0.0.1:18095:8080 \
            -v "$RUNNER_TEMP/phase13-data:/data" \
            -e 'ConnectionStrings__HexCrawl=Host=phase13-postgres;Port=5432;Database=postgres;Username=phase13;Password=phase13;Search Path=phase13_failure' \
            -e 'MapAssets__RootPath=/data/assets' -e 'ToolHost__StandaloneIdentity__Enabled=true' \
            -e 'ToolHost__StandaloneIdentity__UserId=phase13-dm' -e 'Surveyor__BaseUrl=http://phase13-surveyor:8080' \
            -e "Surveyor__ServiceToken=$PHASE13_TOKEN" -e 'Surveyor__RequestTimeoutMilliseconds=35000' phase13-hex:test >/dev/null
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18094/health/ready >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:18095/ready >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs phase13-surveyor || true
          docker logs phase13-hex || true
          exit 1

      - name: Create authoritative raster fixture
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phase13-proof"
          python3 - "$out/fixture.png" <<'PY'
          import struct, sys, zlib
          width,height=640,480
          rows=[]
          for y in range(height):
              row=bytearray(width)
              for x in range(width):
                  row[x]=max(0,min(255,220+(((x*17+y*29+(x*y)%31)%29)-14)))
              rows.append(b'\x00'+bytes(row))
          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',width,height,8,0,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b'')
          open(sys.argv[1],'wb').write(png)
          PY
          curl -fsS -X POST http://127.0.0.1:18095/api/overworlds -H 'Content-Type: application/json' \
            --data '{"name":"Phase 13 failure proof","orientation":"PointyTop","origin":{"x":0,"y":0},"rotationDegrees":0,"hexRadiusWorldUnits":1,"neighborCenterDistance":12,"distanceUnit":{"kind":"Mile","symbol":"mi","metersPerUnit":1609.344}}' -o "$out/world.json"
          world_id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$out/world.json")"
          version="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$out/world.json")"
          curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps" \
            -F "file=@$out/fixture.png;type=image/png;filename=fixture.png" -F 'name=Failure fixture' \
            -F 'geographyKey=failure-fixture' -F 'role=GM' -F 'containsBakedGrid=false' -F "expectedVersion=$version" \
            -o "$out/upload.json"
          map_id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sourceMaps"][-1]["id"])' "$out/upload.json")"
          version="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$out/upload.json")"
          printf '%s\n' "$world_id" "$map_id" "$version" > "$out/ids.txt"
          curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$map_id/grid-analysis" -o "$out/baseline-analysis.json"

      - name: Prove unavailable and retry behavior
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phase13-proof"; mapfile -t ids < "$out/ids.txt"; world_id="${ids[0]}"; map_id="${ids[1]}"
          docker stop phase13-surveyor >/dev/null
          code="$(curl -sS -o "$out/unavailable.json" -w '%{http_code}' -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$map_id/grid-analysis")"
          test "$code" = 503
          docker start phase13-surveyor >/dev/null
          for i in {1..30}; do curl -fsS http://127.0.0.1:18094/health/ready >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -X POST "http://127.0.0.1:18095/api/overworlds/$world_id/source-maps/$map_id/grid-analysis" -o "$out/retry.json"

      - name: Prove authentication failure is typed and non-mutating
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phase13-proof"; mapfile -t ids < "$out/ids.txt"; world_id="${ids[0]}"; map_id="${ids[1]}"
          docker run -d --name phase13-hex-bad-auth --network phase13-proof -p 127.0.0.1:18096:8080 \
            -v "$RUNNER_TEMP/phase13-data:/data" \
            -e 'ConnectionStrings__HexCrawl=Host=phase13-postgres;Port=5432;Database=postgres;Username=phase13;Password=phase13;Search Path=phase13_failure' \
            -e 'MapAssets__RootPath=/data/assets' -e 'ToolHost__StandaloneIdentity__Enabled=true' \
            -e 'ToolHost__StandaloneIdentity__UserId=phase13-dm' -e 'Surveyor__BaseUrl=http://phase13-surveyor:8080' \
            -e 'Surveyor__ServiceToken=wrong-phase13-token-value' phase13-hex:test >/dev/null
          for i in {1..45}; do curl -fsS http://127.0.0.1:18096/ready >/dev/null 2>&1 && break; sleep 1; done
          code="$(curl -sS -o "$out/auth.json" -w '%{http_code}' -X POST "http://127.0.0.1:18096/api/overworlds/$world_id/source-maps/$map_id/grid-analysis")"
          test "$code" = 502
          docker rm -f phase13-hex-bad-auth >/dev/null

      - name: Prove worker timeout is typed and non-mutating
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phase13-proof"; mapfile -t ids < "$out/ids.txt"; world_id="${ids[0]}"; map_id="${ids[1]}"
          docker run -d --name phase13-surveyor-timeout --network phase13-proof \
            -e "SURVEYOR_SERVICE_TOKEN=$PHASE13_TOKEN" -e SURVEYOR_WORKER_COUNT=1 -e SURVEYOR_QUEUE_LIMIT=1 \
            -e SURVEYOR_ANALYSIS_TIMEOUT=1 phase13-surveyor:test >/dev/null
          docker run -d --name phase13-hex-timeout --network phase13-proof -p 127.0.0.1:18097:8080 \
            -v "$RUNNER_TEMP/phase13-data:/data" \
            -e 'ConnectionStrings__HexCrawl=Host=phase13-postgres;Port=5432;Database=postgres;Username=phase13;Password=phase13;Search Path=phase13_failure' \
            -e 'MapAssets__RootPath=/data/assets' -e 'ToolHost__StandaloneIdentity__Enabled=true' \
            -e 'ToolHost__StandaloneIdentity__UserId=phase13-dm' -e 'Surveyor__BaseUrl=http://phase13-surveyor-timeout:8080' \
            -e "Surveyor__ServiceToken=$PHASE13_TOKEN" -e 'Surveyor__RequestTimeoutMilliseconds=35000' phase13-hex:test >/dev/null
          for i in {1..45}; do curl -fsS http://127.0.0.1:18097/ready >/dev/null 2>&1 && break; sleep 1; done
          code="$(curl -sS -o "$out/timeout.json" -w '%{http_code}' -X POST "http://127.0.0.1:18097/api/overworlds/$world_id/source-maps/$map_id/grid-analysis")"
          test "$code" = 504
          docker rm -f phase13-hex-timeout phase13-surveyor-timeout >/dev/null

      - name: Verify no failure mutated Hex Crawl world truth
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/phase13-proof"; mapfile -t ids < "$out/ids.txt"; world_id="${ids[0]}"; map_id="${ids[1]}"; expected_version="${ids[2]}"
          curl -fsS "http://127.0.0.1:18095/api/overworlds/$world_id" -o "$out/after-failures.json"
          python3 - "$out/after-failures.json" "$expected_version" "$map_id" <<'PY'
          import json,sys
          world=json.load(open(sys.argv[1])); assert world['version']==int(sys.argv[2])
          source=next(x for x in world['sourceMaps'] if x['id']==sys.argv[3]); assert source['alignment'] is None
          PY

      - name: Phase 13 architecture audit
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/phase13-proof/architecture-audit.txt"; : > "$report"
          if git grep -n -E 'detectHexLattice|grid-lattice-detector|GrayscaleRaster|mapDetectionToSourceImage|RasterGridAnalysisMaximumDimension' -- src/HexCrawl.Web/Client/src >> "$report"; then
            echo 'browser analysis implementation remains' >&2; exit 1
          fi
          if git grep -n -E 'SURVEYOR_SERVICE_TOKEN|/v1/hex-grid/detect' -- src/HexCrawl.Web/Client/src >> "$report"; then
            echo 'browser has direct Surveyor coupling' >&2; exit 1
          fi
          if git -C "$RUNNER_TEMP/surveyor" grep -n -E 'Overworld|GridDefinition|CampaignProcedure|Expedition|SourceMapDetail|WorldPoint|HexCrawl\.' -- src >> "$report"; then
            echo 'Surveyor embeds Hex Crawl domain state' >&2; exit 1
          fi
          if git -C "$RUNNER_TEMP/surveyor" grep -n -E '\bfetch\(' -- src >> "$report"; then
            echo 'Surveyor performs arbitrary outbound fetches' >&2; exit 1
          fi
          echo 'Phase 13 architecture audit passed.' >> "$report"

      - name: Upload proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase13-failure-boundary-proof
          path: ${{ runner.temp }}/phase13-proof
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          docker rm -f phase13-hex-timeout phase13-surveyor-timeout phase13-hex-bad-auth phase13-hex phase13-surveyor phase13-postgres 2>/dev/null || true
          docker network rm phase13-proof 2>/dev/null || true
