name: Phase 15 Nonspatial Panel Repair

on:
  push:
    branches:
      - feature/phase-15-core-ux

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collapse nonspatial party editor by default
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          presentation = Path('src/HexCrawl.Web/Client/src/modules/expeditions/expedition-presentation.ts')
          text = presentation.read_text()
          old = '<details open class="hc-party-editor-panel"><summary>Party & participant assignments</summary><div data-party-editor></div></details>'
          new = '<details class="hc-party-editor-panel"><summary>Party & participant assignments</summary><div data-party-editor></div></details>'
          if old not in text:
              raise SystemExit('Expected open nonspatial party editor was not found.')
          presentation.write_text(text.replace(old, new, 1))

          test = Path('src/HexCrawl.Web/Client/test/phase15-ux-source.test.mjs')
          text = test.read_text()
          anchor = (
              '    const environment = fs.readFileSync(\n'
              '        path.join(sourceDir, "modules/expeditions/environment-panel.ts"),\n'
              '        "utf8");\n'
          )
          addition = (
              '    const presentation = fs.readFileSync(\n'
              '        path.join(sourceDir, "modules/expeditions/expedition-presentation.ts"),\n'
              '        "utf8");\n'
          )
          assertion_anchor = '    assert.doesNotMatch(environment, /this\\.panel\\.open = true/);\n'
          assertion = '    assert.doesNotMatch(presentation, /<details open class="hc-party-editor-panel"><summary>Party & participant assignments/);\n'
          if anchor not in text:
              raise SystemExit('Expected environment source read was not found.')
          if assertion_anchor not in text:
              raise SystemExit('Expected secondary-panel assertion anchor was not found.')
          if addition not in text:
              text = text.replace(anchor, anchor + addition, 1)
          if assertion not in text:
              text = text.replace(assertion_anchor, assertion_anchor + assertion, 1)
          test.write_text(text)
          PY

          node --test src/HexCrawl.Web/Client/test/phase15-ux-source.test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/HexCrawl.Web/Client/src/modules/expeditions/expedition-presentation.ts \
                  src/HexCrawl.Web/Client/test/phase15-ux-source.test.mjs
          git commit -m 'Collapse nonspatial Phase 15 party editor by default'
          git push origin HEAD:feature/phase-15-core-ux
