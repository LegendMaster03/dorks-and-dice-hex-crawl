name: Finalize Phase 0B Validation Cleanup

on:
  push:
    branches: [ "feature/postgres-persistence" ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize Phase 0B validation cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
      - name: Correct restart smoke contract and remove diagnostics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validate.yml')
          text = path.read_text()
          line = '          assert d["procedureOrigin"]["presetKey"] == "simple-fixed-distance", d\n'
          if text.count(line) != 2:
              raise SystemExit(f'Expected exactly two invalid procedureOrigin API assertions, found {text.count(line)}.')
          path.write_text(text.replace(line, ''))
          PY
          git rm .github/workflows/diagnose-container-smoke.yml
          git rm .github/workflows/finalize-phase0b-ci.yml
          git diff --check
          git diff -- .github/workflows/validate.yml
      - name: Commit final cleanup
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/validate.yml
          git commit -m 'Correct restart smoke contract and remove diagnostics'
          git push origin HEAD:feature/postgres-persistence
