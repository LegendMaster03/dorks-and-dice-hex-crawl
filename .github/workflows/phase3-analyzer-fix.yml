name: Phase 3 analyzer fix

on:
  push:
    branches:
      - feature/phase-3-preset-proof-matrix

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'Add Phase 3 analyzer fix runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-3-preset-proof-matrix
          fetch-depth: 0

      - name: Replace analyzer-invalid prefix assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/HexCrawl.Application.Tests/Phase3ProofMatrixTests.cs')
          text = path.read_text(encoding='utf-8')
          old = '            Assert.True(handler.StartsWith("procedure.", StringComparison.Ordinal));'
          new = '            Assert.StartsWith("procedure.", handler, StringComparison.Ordinal);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one analyzer-invalid assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Commit analyzer fix
        shell: bash
        run: |
          git config user.name 'LegendMaster03'
          git config user.email 'kbarnett0306@gmail.com'
          git add tests/HexCrawl.Application.Tests/Phase3ProofMatrixTests.cs
          git commit -m 'Use xUnit prefix assertion in handler regression'
          git push origin HEAD:feature/phase-3-preset-proof-matrix
