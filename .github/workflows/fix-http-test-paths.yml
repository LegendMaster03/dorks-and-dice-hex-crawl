name: Temporary HTTP Test Path Fix

on:
  push:
    branches: [ "feature/postgres-persistence" ]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger HTTP test path fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
      - name: Replace stale SQLite-derived asset paths
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/HexCrawl.IntegrationTests/SourceMapEndpointsTests.cs')
          text = path.read_text()
          old_archive = 'Path.Combine(database + ".assets", "maps")'
          old_root = 'var assetRoot = database + ".assets";'
          if text.count(old_archive) != 1 or text.count(old_root) != 1:
              raise SystemExit('Expected stale asset path expressions were not found exactly once each.')
          text = text.replace(old_archive, 'Path.Combine(TestWebHost.AssetRoot(database), "maps")')
          text = text.replace(old_root, 'var assetRoot = TestWebHost.AssetRoot(database);')
          path.write_text(text)
          PY
          git diff --check
          git diff -- tests/HexCrawl.IntegrationTests/SourceMapEndpointsTests.cs
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/HexCrawl.IntegrationTests/SourceMapEndpointsTests.cs
          git commit -m 'Fix PostgreSQL source-map asset test paths'
          git push origin HEAD:feature/postgres-persistence
