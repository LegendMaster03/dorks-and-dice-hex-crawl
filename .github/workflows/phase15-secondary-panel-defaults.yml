name: Phase 15 Secondary Panel Repair

on:
  push:
    branches:
      - feature/phase-15-core-ux

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collapse secondary Phase 15 panels by default
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          view = Path('src/HexCrawl.Web/Client/src/modules/expeditions/expedition-view.ts')
          text = view.read_text()
          old = '<details open class="hc-sheet-controls"><summary data-watch-summary>Run watch</summary>'
          new = '<details class="hc-sheet-controls"><summary data-watch-summary>Run watch</summary>'
          if old not in text:
              raise SystemExit('Expected open Run watch details were not found.')
          view.write_text(text.replace(old, new, 1))

          environment = Path('src/HexCrawl.Web/Client/src/modules/expeditions/environment-panel.ts')
          text = environment.read_text()
          old = '        this.panel.open = true;\n'
          if old not in text:
              raise SystemExit('Expected open environment panel initialization was not found.')
          environment.write_text(text.replace(old, '', 1))

          test = Path('src/HexCrawl.Web/Client/test/phase15-ux-source.test.mjs')
          text = test.read_text()
          anchor = '    assert.doesNotMatch(workspace, /api\\.(getExpedition|advanceExpedition|updateExpeditionParty|discover|recordTravelAssistant|recordWatchAssistant|recordNavigationAssistant|recordEncounterAssistant)\\s*=/);\n'
          addition = '    const expeditionView = fs.readFileSync(path.join(sourceDir, "modules/expeditions/expedition-view.ts"), "utf8");\n    const environmentPanel = fs.readFileSync(path.join(sourceDir, "modules/expeditions/environment-panel.ts"), "utf8");\n    assert.doesNotMatch(expeditionView, /<details open class="hc-sheet-controls"/);\n    assert.doesNotMatch(environmentPanel, /this\\.panel\\.open = true/);\n'
          if anchor not in text:
              raise SystemExit('Expected Phase 15 expedition source-test anchor was not found.')
          if addition not in text:
              text = text.replace(anchor, anchor + addition, 1)
          test.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/HexCrawl.Web/Client/src/modules/expeditions/expedition-view.ts \
                  src/HexCrawl.Web/Client/src/modules/expeditions/environment-panel.ts \
                  src/HexCrawl.Web/Client/test/phase15-ux-source.test.mjs
          git diff --cached --check
          git commit -m 'Collapse Phase 15 secondary panels by default'
          git push origin HEAD:feature/phase-15-core-ux
