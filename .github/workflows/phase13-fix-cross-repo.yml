name: Phase 13 proof harness fixer

on:
  push:
    branches: [ "feature/phase-13-shared-map-processing" ]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-13-shared-map-processing
      - name: Fix temporary cross-repository compile mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/phase13-cross-repo.yml')
          lines = path.read_text().splitlines()
          marker_seen = False
          target_line = None
          outdir_line = None
          for index, line in enumerate(lines):
              if 'src/raster-grid-alignment.ts src/hex-grid-analysis.ts' in line:
                  marker_seen = True
                  continue
              if marker_seen and '--target ES2023 --module NodeNext --moduleResolution NodeNext' in line:
                  target_line = index
                  continue
              if target_line is not None and '--outDir .phase13-preview-dist)' in line:
                  outdir_line = index
                  break
          if target_line is None or outdir_line is None:
              raise SystemExit('expected preview compile block not found')
          lines[target_line] = lines[target_line].replace(
              '--module NodeNext --moduleResolution NodeNext',
              '--module CommonJS --moduleResolution Node')
          lines.insert(
              outdir_line + 1,
              "          printf '%s\\n' '{\"type\":\"commonjs\"}' > src/HexCrawl.Web/Client/.phase13-preview-dist/package.json")
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit harness fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/phase13-cross-repo.yml
          git commit -m 'Fix temporary Phase 13 proof compile mode'
          git push origin HEAD:feature/phase-13-shared-map-processing
