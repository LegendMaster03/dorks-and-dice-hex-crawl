name: Validate Hex Crawl

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "**" ]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test frontend
        working-directory: src/HexCrawl.Web/Client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Smoke test Embedded Module client mode
        working-directory: src/HexCrawl.Web/Client
        run: npm run smoke:embedded

      - name: Restore
        run: dotnet restore dorks-and-dice-hex-crawl.slnx

      - name: Build .NET solution
        run: dotnet build dorks-and-dice-hex-crawl.slnx --configuration Release --no-restore -p:BuildClient=false

      - name: Test domain
        run: timeout 120s dotnet test tests/HexCrawl.Domain.Tests/HexCrawl.Domain.Tests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 30s --logger "console;verbosity=normal"

      - name: Test application and persistence
        run: timeout 120s dotnet test tests/HexCrawl.Application.Tests/HexCrawl.Application.Tests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 30s --logger "console;verbosity=normal"

      - name: Test HTTP integration
        run: timeout 120s dotnet test tests/HexCrawl.IntegrationTests/HexCrawl.IntegrationTests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 30s --logger "console;verbosity=normal"

      - name: Explicit render-lifecycle guard
        run: |
          if grep -R --line-number --include='*.ts' 'MutationObserver' src/HexCrawl.Web/Client/src; then
            echo 'Application-owned frontend code must not use MutationObserver.' >&2
            exit 1
          fi

      - name: Build container
        run: docker build -t dorks-and-dice-hex-crawl:test -f src/HexCrawl.Web/Dockerfile .

      - name: Smoke test standalone container and restart persistence
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/hex-crawl-smoke-data"
          response_dir="$RUNNER_TEMP/hex-crawl-smoke-responses"
          mkdir -p "$data_dir" "$response_dir"

          start_container() {
            docker run -d --name hex-crawl-smoke \
              -p 127.0.0.1:18092:8080 \
              -v "$data_dir:/data" \
              -e 'ConnectionStrings__HexCrawl=Data Source=/data/hex-crawl.db' \
              -e 'MapAssets__RootPath=/data/assets' \
              -e 'MapImport__MaxFileBytes=104857600' \
              -e 'ToolHost__StandaloneIdentity__Enabled=true' \
              -e 'ToolHost__StandaloneIdentity__UserId=ci-smoke-dm' \
              -e 'ToolHost__StandaloneIdentity__DisplayName=CI Smoke DM' \
              dorks-and-dice-hex-crawl:test >/dev/null
          }

          wait_ready() {
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:18092/health -o "$response_dir/health.txt" \
                && grep -q 'Healthy' "$response_dir/health.txt" \
                && curl -fsS http://127.0.0.1:18092/ready -o "$response_dir/ready.json" \
                && grep -q '"status":"ready"' "$response_dir/ready.json"; then
                return 0
              fi
              sleep 1
            done
            docker logs hex-crawl-smoke
            return 1
          }

          trap 'docker rm -f hex-crawl-smoke >/dev/null 2>&1 || true' EXIT
          start_container
          wait_ready

          curl -fsS http://127.0.0.1:18092/ -o "$response_dir/root.html"
          grep -q 'tool-root' "$response_dir/root.html"
          curl -fsS http://127.0.0.1:18092/worlds/00000000-0000-0000-0000-000000000001/edit -o "$response_dir/deep-route.html"
          grep -q 'tool-root' "$response_dir/deep-route.html"
          curl -fsS http://127.0.0.1:18092/app.js -o "$response_dir/app.js"
          grep -q 'tool-root' "$response_dir/app.js"

          curl -fsS -X POST http://127.0.0.1:18092/api/overworlds \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI restart proof","orientation":"PointyTop","origin":{"x":0,"y":0},"rotationDegrees":0,"hexRadiusWorldUnits":1,"neighborCenterDistance":12,"distanceUnit":{"kind":"Mile","symbol":"mi","metersPerUnit":1609.344}}' \
            -o "$response_dir/create-world.json"
          grep -q 'CI restart proof' "$response_dir/create-world.json"
          world_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$response_dir/create-world.json")"
          world_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$response_dir/create-world.json")"

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > "$response_dir/tiny.png"
          curl -fsS -X POST "http://127.0.0.1:18092/api/overworlds/$world_id/source-maps" \
            -F "file=@$response_dir/tiny.png;type=image/png;filename=ci-map.png" \
            -F 'name=CI raster' \
            -F 'geographyKey=CI geography' \
            -F 'role=Neutral' \
            -F 'containsBakedGrid=false' \
            -F "expectedVersion=$world_version" \
            -o "$response_dir/upload-map.json"
          grep -q 'CI raster' "$response_dir/upload-map.json"
          source_map_id="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["sourceMaps"][-1]["id"])' "$response_dir/upload-map.json")"

          curl -fsS "http://127.0.0.1:18092/api/overworlds/$world_id/source-maps/$source_map_id/asset" -o "$response_dir/map-before-restart.png"
          cmp "$response_dir/tiny.png" "$response_dir/map-before-restart.png"
          test -d "$data_dir/assets/maps"
          test "$(find "$data_dir/assets/maps" -type f | wc -l)" -eq 1

          curl -fsS -X POST "http://127.0.0.1:18092/api/overworlds/$world_id/expeditions" \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI paused expedition","procedureKey":"simple-fixed-distance","presentationKey":"exploration-map","startHex":{"q":0,"r":0}}' \
            -o "$response_dir/start-expedition.json"
          expedition_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$response_dir/start-expedition.json")"
          expedition_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$response_dir/start-expedition.json")"

          curl -fsS -X POST "http://127.0.0.1:18092/api/expeditions/$expedition_id/advance" \
            -H 'Content-Type: application/json' \
            --data "{\"expectedVersion\":$expedition_version,\"intendedDirection\":0,\"effectiveDistance\":12,\"travelResolutionSource\":\"ManualRoll\",\"continueAcrossBoundaries\":false}" \
            -o "$response_dir/pause-expedition.json"
          python3 - "$response_dir/pause-expedition.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["pauseReason"] == "ConditionsReviewRequired", d
          assert d["remainingWatchHours"] == 2, d
          assert d["expedition"]["activeWatchNumber"] == 1, d
          assert d["presentation"]["key"] == "exploration-map", d
          assert {"q": 0, "r": 0} in d["knownHexes"], d
          PY

          docker rm -f hex-crawl-smoke >/dev/null
          start_container
          wait_ready

          curl -fsS http://127.0.0.1:18092/api/overworlds -o "$response_dir/worlds-after-restart.json"
          grep -q 'CI restart proof' "$response_dir/worlds-after-restart.json"
          curl -fsS "http://127.0.0.1:18092/api/overworlds/$world_id/source-maps" -o "$response_dir/maps-after-restart.json"
          grep -q '"pixelWidth":1' "$response_dir/maps-after-restart.json"
          grep -q '"mediaType":"image/png"' "$response_dir/maps-after-restart.json"
          curl -fsS "http://127.0.0.1:18092/api/overworlds/$world_id/source-maps/$source_map_id/asset" -o "$response_dir/map-after-restart.png"
          cmp "$response_dir/tiny.png" "$response_dir/map-after-restart.png"

          curl -fsS "http://127.0.0.1:18092/api/expeditions/$expedition_id" -o "$response_dir/expedition-after-restart.json"
          python3 - "$response_dir/expedition-after-restart.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["pauseReason"] == "ConditionsReviewRequired", d
          assert d["remainingWatchHours"] == 2, d
          assert d["expedition"]["activeWatchNumber"] == 1, d
          assert d["expedition"]["activeWatchElapsedHours"] == 2, d
          assert d["profile"]["key"] == "simple-fixed-distance", d
          assert d["presentation"]["key"] == "exploration-map", d
          PY
          resumed_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$response_dir/expedition-after-restart.json")"

          curl -fsS -X POST "http://127.0.0.1:18092/api/expeditions/$expedition_id/advance" \
            -H 'Content-Type: application/json' \
            --data "{\"expectedVersion\":$resumed_version,\"intendedDirection\":0,\"effectiveDistance\":6,\"travelResolutionSource\":\"ManualRoll\",\"travelResolutionNote\":\"resume after restart\",\"continueAcrossBoundaries\":true}" \
            -o "$response_dir/resume-expedition.json"
          python3 - "$response_dir/resume-expedition.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["pauseReason"] is None, d
          assert d["remainingWatchHours"] == 0, d
          assert d["expedition"]["activeWatchNumber"] is None, d
          assert d["expedition"]["completedWatches"] == 1, d
          assert d["expedition"]["elapsedTravelHours"] == 4, d
          PY
