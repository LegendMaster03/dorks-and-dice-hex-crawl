name: Validate Hex Crawl

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "**" ]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  HEXCRAWL_TEST_POSTGRES: "Host=127.0.0.1;Port=55432;Database=postgres;Username=hex_crawl_test;Password=hex_crawl_test"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test frontend
        working-directory: src/HexCrawl.Web/Client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Smoke test Embedded Module client mode
        working-directory: src/HexCrawl.Web/Client
        run: npm run smoke:embedded

      - name: Start PostgreSQL test service
        run: |
          set -euo pipefail
          docker rm -f hex-crawl-ci-postgres 2>/dev/null || true
          docker network create hex-crawl-ci 2>/dev/null || true
          docker run -d --name hex-crawl-ci-postgres \
            --network hex-crawl-ci \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_USER=hex_crawl_test \
            -e POSTGRES_PASSWORD=hex_crawl_test \
            postgres:18 >/dev/null

          sleep 10
          consecutive=0
          for i in {1..30}; do
            result=$(docker exec hex-crawl-ci-postgres \
              psql -v ON_ERROR_STOP=1 -U hex_crawl_test -d postgres -tAc 'SELECT 1' \
              2>/dev/null || true)
            if [ "$(echo "$result" | tr -d '[:space:]')" = "1" ]; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then break; fi
            else
              consecutive=0
            fi
            sleep 1
          done
          if [ "$consecutive" -lt 3 ]; then
            docker logs hex-crawl-ci-postgres || true
            exit 1
          fi

      - name: Restore
        run: dotnet restore dorks-and-dice-hex-crawl.slnx

      - name: Build .NET solution
        run: dotnet build dorks-and-dice-hex-crawl.slnx --configuration Release --no-restore -p:BuildClient=false

      - name: Test domain
        run: timeout 180s dotnet test tests/HexCrawl.Domain.Tests/HexCrawl.Domain.Tests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 45s --logger "console;verbosity=normal"

      - name: Test application and PostgreSQL persistence
        run: timeout 300s dotnet test tests/HexCrawl.Application.Tests/HexCrawl.Application.Tests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 60s --logger "console;verbosity=normal"

      - name: Test HTTP integration against PostgreSQL
        run: timeout 300s dotnet test tests/HexCrawl.IntegrationTests/HexCrawl.IntegrationTests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 60s --logger "console;verbosity=normal"

      - name: Explicit render-lifecycle guard
        run: |
          if grep -R --line-number --include='*.ts' 'MutationObserver' src/HexCrawl.Web/Client/src; then
            echo 'Application-owned frontend code must not use MutationObserver.' >&2
            exit 1
          fi

      - name: Build container
        run: docker build -t dorks-and-dice-hex-crawl:test -f src/HexCrawl.Web/Dockerfile .

      - name: Build persistence migration container
        run: docker build -t dorks-and-dice-hex-crawl-migration:test -f tools/HexCrawl.PersistenceMigration/Dockerfile .

      - name: Smoke test PostgreSQL, filesystem assets, and restart persistence
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/hex-crawl-smoke-data"
          response_dir="$RUNNER_TEMP/hex-crawl-smoke-responses"
          rm -rf "$data_dir" "$response_dir"
          mkdir -p "$data_dir" "$response_dir"
          docker exec hex-crawl-ci-postgres psql -v ON_ERROR_STOP=1 -U hex_crawl_test -d postgres -c 'CREATE SCHEMA smoke_world;' >/dev/null

          start_app() {
            docker run -d --name hex-crawl-smoke \
              --network hex-crawl-ci \
              -p 127.0.0.1:18092:8080 \
              -v "$data_dir:/data" \
              -e 'ConnectionStrings__HexCrawl=Host=hex-crawl-ci-postgres;Port=5432;Database=postgres;Username=hex_crawl_test;Password=hex_crawl_test;Search Path=smoke_world' \
              -e 'MapAssets__RootPath=/data/assets' \
              -e 'ToolHost__StandaloneIdentity__Enabled=true' \
              -e 'ToolHost__StandaloneIdentity__UserId=ci-smoke-dm' \
              -e 'ToolHost__StandaloneIdentity__DisplayName=CI Smoke DM' \
              dorks-and-dice-hex-crawl:test >/dev/null
          }

          wait_app() {
            for i in {1..45}; do
              if curl -fsS http://127.0.0.1:18092/health -o "$response_dir/health.txt" \
                && grep -q 'Healthy' "$response_dir/health.txt" \
                && curl -fsS http://127.0.0.1:18092/ready -o "$response_dir/ready.json" \
                && grep -q '"status":"ready"' "$response_dir/ready.json" \
                && grep -q '"persistence":"postgresql-ready"' "$response_dir/ready.json" \
                && grep -q '"mapAssets":"filesystem"' "$response_dir/ready.json"; then
                return 0
              fi
              sleep 1
            done
            docker logs hex-crawl-smoke || true
            return 1
          }

          start_app
          wait_app
          curl -fsS http://127.0.0.1:18092/app.js -o "$response_dir/app.js"
          test -s "$response_dir/app.js"

          curl -fsS -X POST http://127.0.0.1:18092/api/overworlds \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI PostgreSQL restart proof","orientation":"PointyTop","origin":{"x":0,"y":0},"rotationDegrees":0,"hexRadiusWorldUnits":1,"neighborCenterDistance":12,"distanceUnit":{"kind":"Mile","symbol":"mi","metersPerUnit":1609.344}}' \
            -o "$response_dir/create-world.json"
          world_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$response_dir/create-world.json")"
          world_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$response_dir/create-world.json")"

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > "$response_dir/tiny.png"
          curl -fsS -X POST "http://127.0.0.1:18092/api/overworlds/$world_id/source-maps" \
            -F "file=@$response_dir/tiny.png;type=image/png;filename=ci-map.png" \
            -F 'name=CI raster' -F 'geographyKey=CI geography' -F 'role=Neutral' \
            -F 'containsBakedGrid=false' -F "expectedVersion=$world_version" \
            -o "$response_dir/upload-map.json"
          source_map_id="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["sourceMaps"][-1]["id"])' "$response_dir/upload-map.json")"

          curl -fsS -X POST "http://127.0.0.1:18092/api/overworlds/$world_id/expeditions" \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI persisted procedure","procedureKey":"simple-fixed-distance","presentationKey":"exploration-map","startHex":{"q":0,"r":0}}' \
            -o "$response_dir/start-expedition.json"
          expedition_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$response_dir/start-expedition.json")"
          expedition_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$response_dir/start-expedition.json")"
          curl -fsS -X POST "http://127.0.0.1:18092/api/expeditions/$expedition_id/advance" \
            -H 'Content-Type: application/json' \
            --data "{\"expectedVersion\":$expedition_version,\"intendedDirection\":0,\"expectedDistance\":12,\"actualDistance\":12,\"resolutionSource\":\"ManualRoll\",\"continueAcrossBoundaries\":false}" \
            -o "$response_dir/advance.json"

          docker rm -f hex-crawl-smoke >/dev/null
          docker restart hex-crawl-ci-postgres >/dev/null
          sleep 5
          for i in {1..30}; do
            if [ "$(docker exec hex-crawl-ci-postgres psql -U hex_crawl_test -d postgres -tAc 'SELECT 1' 2>/dev/null | tr -d '[:space:]')" = "1" ]; then break; fi
            sleep 1
          done
          start_app
          wait_app

          curl -fsS http://127.0.0.1:18092/api/overworlds -o "$response_dir/worlds-after-restart.json"
          grep -q 'CI PostgreSQL restart proof' "$response_dir/worlds-after-restart.json"
          curl -fsS "http://127.0.0.1:18092/api/expeditions/$expedition_id" -o "$response_dir/expedition-after-restart.json"
          python3 - "$response_dir/expedition-after-restart.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["profile"]["key"] == "simple-fixed-distance", d
          assert d["expedition"]["activeWatchNumber"] == 1, d
          PY
          curl -fsS "http://127.0.0.1:18092/api/overworlds/$world_id/source-maps/$source_map_id/asset" -o "$response_dir/map-after-restart.png"
          cmp "$response_dir/tiny.png" "$response_dir/map-after-restart.png"

      - name: Smoke test mapless PostgreSQL session restart
        run: |
          set -euo pipefail
          response_dir="$RUNNER_TEMP/hex-crawl-mapless-smoke"
          mkdir -p "$response_dir"
          docker exec hex-crawl-ci-postgres psql -v ON_ERROR_STOP=1 -U hex_crawl_test -d postgres -c 'CREATE SCHEMA smoke_mapless;' >/dev/null
          docker run -d --name hex-crawl-mapless-smoke \
            --network hex-crawl-ci -p 127.0.0.1:18093:8080 \
            -e 'ConnectionStrings__HexCrawl=Host=hex-crawl-ci-postgres;Port=5432;Database=postgres;Username=hex_crawl_test;Password=hex_crawl_test;Search Path=smoke_mapless' \
            -e 'MapAssets__RootPath=/data/assets' \
            -e 'ToolHost__StandaloneIdentity__Enabled=true' \
            -e 'ToolHost__StandaloneIdentity__UserId=ci-mapless-dm' \
            dorks-and-dice-hex-crawl:test >/dev/null
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18093/ready -o "$response_dir/ready.json" \
              && grep -q '"persistence":"postgresql-ready"' "$response_dir/ready.json"; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:18093/api/expeditions \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI mapless PostgreSQL","procedureKey":"simple-fixed-distance","context":{"kind":"NonSpatial","name":"CI procedure clock"}}' \
            -o "$response_dir/session.json"
          session_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$response_dir/session.json")"
          docker rm -f hex-crawl-mapless-smoke >/dev/null
          docker run -d --name hex-crawl-mapless-smoke \
            --network hex-crawl-ci -p 127.0.0.1:18093:8080 \
            -e 'ConnectionStrings__HexCrawl=Host=hex-crawl-ci-postgres;Port=5432;Database=postgres;Username=hex_crawl_test;Password=hex_crawl_test;Search Path=smoke_mapless' \
            -e 'MapAssets__RootPath=/data/assets' \
            -e 'ToolHost__StandaloneIdentity__Enabled=true' \
            -e 'ToolHost__StandaloneIdentity__UserId=ci-mapless-dm' \
            dorks-and-dice-hex-crawl:test >/dev/null
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18093/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:18093/api/expeditions/$session_id" -o "$response_dir/reloaded.json"
          python3 - "$response_dir/reloaded.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["context"]["kind"] == "NonSpatial", d
          assert d["profile"]["key"] == "simple-fixed-distance", d
          PY

      - name: Cleanup PostgreSQL validation infrastructure
        if: always()
        run: |
          docker rm -f hex-crawl-smoke 2>/dev/null || true
          docker rm -f hex-crawl-mapless-smoke 2>/dev/null || true
          docker rm -f hex-crawl-ci-postgres 2>/dev/null || true
          docker network rm hex-crawl-ci 2>/dev/null || true
