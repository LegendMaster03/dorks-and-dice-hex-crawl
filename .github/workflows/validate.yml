name: Validate Hex Crawl

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "**" ]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test frontend
        working-directory: src/HexCrawl.Web/Client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Smoke test Embedded Module client mode
        working-directory: src/HexCrawl.Web/Client
        run: npm run smoke:embedded

      - name: Restore
        run: dotnet restore dorks-and-dice-hex-crawl.slnx

      - name: Build .NET solution
        run: dotnet build dorks-and-dice-hex-crawl.slnx --configuration Release --no-restore -p:BuildClient=false

      - name: Test domain
        run: timeout 120s dotnet test tests/HexCrawl.Domain.Tests/HexCrawl.Domain.Tests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 30s --logger "console;verbosity=normal"

      - name: Diagnose runtime history persistence
        continue-on-error: true
        env:
          HEX_CRAWL_HISTORY_PHASE_LOG: ${{ runner.temp }}/hex-crawl-history-phase.log
        run: |
          rm -f "$HEX_CRAWL_HISTORY_PHASE_LOG"
          timeout 15s dotnet test tests/HexCrawl.Application.Tests/HexCrawl.Application.Tests.csproj \
            --configuration Release --no-restore --no-build -p:BuildClient=false \
            --filter "FullyQualifiedName~PersistenceHistoryDiagnosticTests.RuntimeHistoryPersistencePhasesComplete" \
            --logger "console;verbosity=normal"

      - name: Show runtime history diagnostic phase
        if: always()
        run: cat "${{ runner.temp }}/hex-crawl-history-phase.log" || true

      - name: Test application and persistence
        run: timeout 120s dotnet test tests/HexCrawl.Application.Tests/HexCrawl.Application.Tests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --filter "FullyQualifiedName!~RuntimeHistorySurvivesReloadWithoutDuplication&FullyQualifiedName!~PersistenceHistoryDiagnosticTests" --blame-hang --blame-hang-timeout 30s --logger "console;verbosity=normal"

      - name: Test HTTP integration
        run: timeout 120s dotnet test tests/HexCrawl.IntegrationTests/HexCrawl.IntegrationTests.csproj --configuration Release --no-restore --no-build -p:BuildClient=false --blame-hang --blame-hang-timeout 30s --logger "console;verbosity=normal"

      - name: Build container
        run: docker build -t dorks-and-dice-hex-crawl:test -f src/HexCrawl.Web/Dockerfile .

      - name: Smoke test standalone container and restart persistence
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/hex-crawl-smoke-data"
          mkdir -p "$data_dir"

          start_container() {
            docker run -d --name hex-crawl-smoke \
              -p 127.0.0.1:18092:8080 \
              -v "$data_dir:/data" \
              -e 'ConnectionStrings__HexCrawl=Data Source=/data/hex-crawl.db' \
              -e 'ToolHost__StandaloneIdentity__Enabled=true' \
              -e 'ToolHost__StandaloneIdentity__UserId=ci-smoke-dm' \
              -e 'ToolHost__StandaloneIdentity__DisplayName=CI Smoke DM' \
              dorks-and-dice-hex-crawl:test >/dev/null
          }

          wait_ready() {
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:18092/health | grep -q 'Healthy' \
                && curl -fsS http://127.0.0.1:18092/ready | grep -q '"status":"ready"'; then
                return 0
              fi
              sleep 1
            done
            docker logs hex-crawl-smoke
            return 1
          }

          trap 'docker rm -f hex-crawl-smoke >/dev/null 2>&1 || true' EXIT
          start_container
          wait_ready

          curl -fsS http://127.0.0.1:18092/ | grep -q 'tool-root'
          curl -fsS http://127.0.0.1:18092/worlds/00000000-0000-0000-0000-000000000001/edit | grep -q 'tool-root'
          curl -fsS http://127.0.0.1:18092/app.js | grep -q 'tool-root'

          curl -fsS -X POST http://127.0.0.1:18092/api/overworlds \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI restart proof","orientation":"PointyTop","origin":{"x":0,"y":0},"rotationDegrees":0,"hexRadiusWorldUnits":1,"neighborCenterDistance":12,"distanceUnit":{"kind":"Mile","symbol":"mi","metersPerUnit":1609.344}}' \
            | grep -q 'CI restart proof'

          docker rm -f hex-crawl-smoke >/dev/null
          start_container
          wait_ready
          curl -fsS http://127.0.0.1:18092/api/overworlds | grep -q 'CI restart proof'
