name: Deploy Hex Crawl
run-name: Deploy ${{ github.event.workflow_run.head_branch || github.ref_name }} at ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [ "Validate Hex Crawl" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: dorks-and-dice-hex-crawl
  # Never interrupt a host deployment between container replacement and verification.
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, dorks-and-dice-hex-crawl]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Retain the actual running image before overwriting latest
        id: previous_image
        run: |
          set -euo pipefail
          previous_image="$(docker inspect --type container --format '{{if .State.Running}}{{.Image}}{{end}}' dorks-and-dice-hex-crawl 2>/dev/null || true)"
          if [ -n "$previous_image" ]; then
            docker image inspect "$previous_image" >/dev/null
            docker image tag "$previous_image" dorks-and-dice-hex-crawl:pre-deploy
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "image=$previous_image" >> "$GITHUB_OUTPUT"
            echo "Retained previous running image $previous_image as dorks-and-dice-hex-crawl:pre-deploy"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No running dorks-and-dice-hex-crawl container; no rollback image for a first deployment"
          fi

      - name: Build image
        timeout-minutes: 10
        run: |
          docker build --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            -t dorks-and-dice-hex-crawl:latest -t "dorks-and-dice-hex-crawl:$DEPLOY_SHA" \
            -f src/HexCrawl.Web/Dockerfile .

      - name: Start smoke-test PostgreSQL
        timeout-minutes: 3
        run: |
          docker rm -f dorks-and-dice-hex-crawl-test-postgres 2>/dev/null || true
          docker network create dorks-and-dice-hex-crawl-test 2>/dev/null || true
          docker run -d --name dorks-and-dice-hex-crawl-test-postgres \
            --network dorks-and-dice-hex-crawl-test \
            -e POSTGRES_DB=hex_crawl_test \
            -e POSTGRES_USER=hex_crawl_test \
            -e POSTGRES_PASSWORD=hex_crawl_test \
            postgres:18 >/dev/null
          sleep 10
          consecutive=0
          for i in {1..30}; do
            result=$(docker exec dorks-and-dice-hex-crawl-test-postgres \
              psql -v ON_ERROR_STOP=1 -U hex_crawl_test -d hex_crawl_test -tAc 'SELECT 1' 2>/dev/null || true)
            if [ "$(echo "$result" | tr -d '[:space:]')" = "1" ]; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then break; fi
            else
              consecutive=0
            fi
            sleep 1
          done
          if [ "$consecutive" -lt 3 ]; then
            docker logs dorks-and-dice-hex-crawl-test-postgres || true
            exit 1
          fi

      - name: Smoke test PostgreSQL-backed container
        timeout-minutes: 5
        run: |
          docker rm -f dorks-and-dice-hex-crawl-smoketest 2>/dev/null || true
          docker run -d --name dorks-and-dice-hex-crawl-smoketest \
            --network dorks-and-dice-hex-crawl-test \
            -e 'ConnectionStrings__HexCrawl=Host=dorks-and-dice-hex-crawl-test-postgres;Port=5432;Database=hex_crawl_test;Username=hex_crawl_test;Password=hex_crawl_test' \
            -e 'MapAssets__RootPath=/data/assets' \
            -e 'ToolHost__StandaloneIdentity__Enabled=true' \
            -e 'ToolHost__StandaloneIdentity__UserId=deploy-smoke' \
            dorks-and-dice-hex-crawl:latest >/dev/null

          ready=false
          for i in {1..45}; do
            if [ "$(docker inspect -f '{{.State.Running}}' dorks-and-dice-hex-crawl-smoketest 2>/dev/null)" != "true" ]; then
              docker logs dorks-and-dice-hex-crawl-smoketest || true
              exit 1
            fi
            health=$(docker run --rm --network dorks-and-dice-hex-crawl-test curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-hex-crawl-smoketest:8080/health 2>/dev/null || true)
            readiness=$(docker run --rm --network dorks-and-dice-hex-crawl-test curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-hex-crawl-smoketest:8080/ready 2>/dev/null || true)
            appjs=$(docker run --rm --network dorks-and-dice-hex-crawl-test curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-hex-crawl-smoketest:8080/app.js 2>/dev/null || true)
            if [ "$health" = "Healthy" ] \
              && echo "$readiness" | grep -q '"status":"ready"' \
              && echo "$readiness" | grep -q '"persistence":"postgresql-ready"' \
              && echo "$readiness" | grep -q '"mapAssets":"filesystem"' \
              && [ -n "$appjs" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs dorks-and-dice-hex-crawl-smoketest || true
            exit 1
          fi

      - name: Cleanup smoke-test infrastructure
        if: always()
        timeout-minutes: 3
        run: |
          docker rm -f dorks-and-dice-hex-crawl-smoketest 2>/dev/null || true
          docker rm -f dorks-and-dice-hex-crawl-test-postgres 2>/dev/null || true
          docker network rm dorks-and-dice-hex-crawl-test 2>/dev/null || true

      - name: Deploy
        id: deploy
        timeout-minutes: 5
        run: |
          ENV_FILE="${DEPLOY_ENV_FILE:-/mnt/HDDs/www/dorks-and-dice-hex-crawl/.env}"
          if [ ! -f "$ENV_FILE" ]; then
            echo "Hex Crawl deployment configuration is missing: $ENV_FILE"
            exit 1
          fi
          docker compose \
            --project-name dorks-and-dice-hex-crawl \
            --env-file "$ENV_FILE" \
            -f docker-compose.yml config >/dev/null
          docker rm -f dorks-and-dice-hex-crawl 2>/dev/null || true
          docker compose \
            --project-name dorks-and-dice-hex-crawl \
            --env-file "$ENV_FILE" \
            -f docker-compose.yml up -d --force-recreate --remove-orphans

      - name: Verify deployed service
        id: verify
        timeout-minutes: 5
        run: |
          set -euo pipefail
          actual_image_revision="$(docker inspect --type container --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' dorks-and-dice-hex-crawl 2>/dev/null || true)"
          if [ "$actual_image_revision" != "$DEPLOY_SHA" ]; then
            echo "Running image revision $actual_image_revision does not match expected $DEPLOY_SHA" >&2
            exit 1
          fi
          ready=false
          for i in $(seq 1 "${DEPLOY_HEALTH_ATTEMPTS:-60}"); do
            health=$(docker run --rm --network dorks-and-dice-backend curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-hex-crawl:8080/health 2>/dev/null || true)
            readiness=$(docker run --rm --network dorks-and-dice-backend curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-hex-crawl:8080/ready 2>/dev/null || true)
            appjs=$(docker run --rm --network dorks-and-dice-backend curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-hex-crawl:8080/app.js 2>/dev/null || true)
            if [ "$health" = "Healthy" ] \
              && echo "$readiness" | grep -q '"status":"ready"' \
              && echo "$readiness" | grep -q '"persistence":"postgresql-ready"' \
              && echo "$readiness" | grep -q '"mapAssets":"filesystem"' \
              && [ -n "$appjs" ]; then
              echo "$readiness"
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs dorks-and-dice-hex-crawl || true
            exit 1
          fi

      - name: Restore previous running image after failed deploy or verification
        if: ${{ failure() && steps.previous_image.outputs.available == 'true' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ENV_FILE="${DEPLOY_ENV_FILE:-/mnt/HDDs/www/dorks-and-dice-hex-crawl/.env}"
          if [ ! -f "$ENV_FILE" ]; then
            echo "Rollback configuration is missing; previous image was retained as dorks-and-dice-hex-crawl:pre-deploy" >&2
            exit 1
          fi
          docker image inspect dorks-and-dice-hex-crawl:pre-deploy >/dev/null
          docker image tag dorks-and-dice-hex-crawl:pre-deploy dorks-and-dice-hex-crawl:latest
          docker rm -f dorks-and-dice-hex-crawl 2>/dev/null || true
          docker compose \
            --project-name dorks-and-dice-hex-crawl \
            --env-file "$ENV_FILE" \
            -f docker-compose.yml up -d --force-recreate --remove-orphans
          restored=false
          for i in $(seq 1 "${DEPLOY_HEALTH_ATTEMPTS:-60}"); do
            readiness=$(docker run --rm --network dorks-and-dice-backend curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-hex-crawl:8080/ready 2>/dev/null || true)
            if echo "$readiness" | grep -q '"status":"ready"' \
              && echo "$readiness" | grep -q '"persistence":"postgresql-ready"'; then
              restored=true
              break
            fi
            sleep 1
          done
          if [ "$restored" != true ]; then
            echo "ALERT: previous image could not be verified; immediate operator intervention required" >&2
            docker logs dorks-and-dice-hex-crawl || true
            exit 1
          fi
          restored_image="$(docker inspect --type container --format '{{.Image}}' dorks-and-dice-hex-crawl 2>/dev/null || true)"
          expected_previous_image="${{ steps.previous_image.outputs.image }}"
          if [ "$restored_image" != "$expected_previous_image" ]; then
            echo "Rollback started image $restored_image, expected $expected_previous_image" >&2
            exit 1
          fi
          echo "Previous deployed image $restored_image has been restored and verified. This deployment remains FAILED."
