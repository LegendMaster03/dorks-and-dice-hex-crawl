name: Apply Phase 0B semantic assertion fixes

on:
  push:
    branches:
      - feature/postgres-persistence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-persistence
          fetch-depth: 0

      - name: Apply semantic assertion fixes
        run: python3 scripts/phase0b-fix-semantic-assertions.py

      - name: Commit fixes and remove one-shot helpers
        run: |
          rm -f scripts/phase0b-fix-semantic-assertions.py
          rm -f .github/workflows/phase0b-apply-semantic-assertions.yml
          git diff --check
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Compare PostgreSQL test results semantically"
          git push origin HEAD:feature/postgres-persistence
